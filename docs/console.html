/* ---------- overview ---------- */
function renderOverview(){
  const rows=DATA.comparison;
  const v5=rows.find(r=>r.system==='agent-v5')||{}, base=rows.find(r=>r.system==='baseline')||{};
  const t3v=DATA.tier3['agent-v5']||{}, t3b=DATA.tier3['baseline']||{};
  view.innerHTML='';
  view.append($(`<div>
    <div class="eyebrow">the scoreboard</div>
    <h1>RevGuard — evidence-linked code review</h1>
    <div class="sub">A pipeline of specialist reviewers whose every finding must survive an adversarial verifier that tries to disprove it by running the code. Scored on 22 pull requests with 61 planted, labeled bugs — the same cases and one fixed rule for every system.</div>
  </div>`));

  // headline: the tier-3 win (where review is actually hard)
  view.append($(`<div><div class="spacer"></div>
    <h2>Where review is hard — the six large, multi-file PRs (tier 3)</h2>
    <div class="sub" style="margin-bottom:14px">On small PRs the base model is already perfect, so we don't claim credit there. The pipeline earns its keep on the realistic ones:</div>
    <div class="tiles">
      <div class="tile accent"><div class="n">${t3v.f1??'–'}</div><div class="l">RevGuard v5 — tier-3 F1</div></div>
      <div class="tile"><div class="n">${t3b.f1??'–'}</div><div class="l">baseline — tier-3 F1</div></div>
      <div class="tile pass"><div class="n">${t3v.fp??'–'}</div><div class="l">v5 false positives (vs ${t3b.fp??'–'} baseline)</div></div>
      <div class="tile"><div class="n">$${v5.avg_cost??'–'}</div><div class="l">avg cost / review · ${v5.avg_s??'–'}s · vs ~1hr human</div></div>
    </div></div>`));

  view.append($(`<div><div class="spacer"></div>
    <h2>Every system, same 22 cases, same rule</h2>
    <div class="sub" style="margin-bottom:12px">The changelog in code form. Overall F1 favors the baseline only because the small-PR tier is saturated (39/39) — the honest headline is the tier-3 table above. Adding agent machinery made things worse until we measured why.</div></div>`));
  const tbl=$(`<div class="tablewrap"><table><thead><tr>
    <th>system</th><th>found</th><th>recall</th><th>precision</th><th>F1</th><th>false pos</th><th>clean-PR FP</th><th>avg s</th><th>avg $</th>
    </tr></thead><tbody></tbody></table></div>`);
  const tb=tbl.querySelector('tbody');
  rows.forEach(r=>{
    const win=r.system==='agent-v5';
    tb.append($(`<tr class="${win?'win':''}">
      <td class="sys">${esc(label(r.system))}</td><td>${r.found}</td><td>${r.recall}</td>
      <td>${r.precision}</td><td class="f1">${r.f1}</td><td>${r.fp}</td><td>${r.clean_fp}</td>
      <td>${r.avg_s}</td><td>$${r.avg_cost}</td></tr>`));
  });
  view.append(tbl);
  view.append($(`<div><div class="spacer"></div><div class="note">
    v1 (tools + a cautious prompt) was <span style="color:var(--crit)">worse</span> than the baseline;
    the verifier once confirmed 54/54 findings — a rubber stamp, because verification checks <i>truth</i>
    and most bad review comments are true. v5 pairs recall-tuned reviewers with a <b style="color:var(--fg)">policy-gated verifier</b>.
    Open <b style="color:var(--fg)">Verification traces</b> to watch it reproduce a real crash before confirming it.
  </div></div>`));
}
const label=(s)=>({baseline:'baseline · 1 prompt','agent-v1':'v1 · tooled generalist',
  'agent-v2':'v2 · specialists','agent-v3':'v3 · + verifier','agent-v4':'v4 · + nitpick (removed)',
  'agent-v5':'v5 · recall-tuned + policy gate'}[s]||s);

/* ---------- cases list ---------- */
function renderCases(){
  view.innerHTML='';
  view.append($(`<div><div class="eyebrow">22 pull requests · 61 planted bugs</div>
    <h1>Cases &amp; findings</h1>
    <div class="sub">Each is a real pull request whose test suite <b>passes</b> — the bugs are hidden from CI. Click one to see the diff, what each system found, and the ground truth.</div></div>`));
  const grid=$(`<div class="cases"></div>`);
  DATA.cases.forEach(c=>{
    const d=DATA.detail[c.id], v5=d.systems['agent-v5'];
    const foundTxt = c.clean ? 'clean PR' : `${v5?v5.found:0}/${c.gt} bugs found`;
    const cls = c.clean ? 'clean' : (v5 && v5.found===c.gt ? 'found':'miss');
    grid.append($(`<button class="casecard" onclick="location.hash='#/cases/${c.id}'">
      <div class="id">${esc(c.id)}</div>
      <div class="t">${esc(c.title)}</div>
      <div class="meta">
        <span class="chip tier">tier ${c.tier}</span>
        ${c.clean?'<span class="chip clean">clean</span>':''}
        <span class="chip ${cls}">${foundTxt}</span>
      </div></button>`));
  });
  view.append(grid);
}

/* ---------- case detail ---------- */
function renderCase(id){
  const d=DATA.detail[id]; if(!d){location.hash='#/cases';return;}
  view.innerHTML='';
  view.append($(`<div class="crumb"><a href="#/cases">Cases</a> ／ <span>${esc(id)}</span></div>`));
  view.append($(`<div><h1>${esc(d.meta.title)}</h1>
    <div class="sub">${esc(d.meta.pr_description)}</div>
    <div class="meta row" style="margin-top:12px">
      <span class="chip tier">tier ${d.meta.tier}</span>
      ${d.meta.clean?'<span class="chip clean">clean PR — no planted bugs</span>':`<span class="chip">${d.meta.defects.length} planted bug(s)</span>`}
    </div></div>`));

  // findings: baseline vs v5
  const cols=$(`<div class="cols"></div>`);
  DATA.detail_systems.forEach(sys=>{
    const s=d.systems[sys];
    const col=$(`<div class="col"><h3><span>${esc(label(sys))}</span>
      <span>${s?`${s.findings.length} shown · $${(s.cost_usd||0).toFixed(2)}`:'—'}</span></h3></div>`);
    if(!s || !s.findings.length){ col.append($(`<div class="empty">No findings reported.</div>`)); }
    else s.findings.slice().sort(bySev).forEach((f,i)=>col.append(findingCard(f,sys,id,i)));
    cols.append(col);
  });
  view.append(cols);

  // ground truth
  if(d.meta.defects.length){
    view.append($(`<div><div class="spacer"></div><h2>Ground truth — the planted bugs</h2>
      <div class="sub" style="margin-bottom:10px">What we hid in this PR, and whether v5 caught each.</div></div>`));
    const v5=d.systems['agent-v5'];
    const missed=new Set(v5?v5.missed:[]);
    const gtbox=$(`<div></div>`);
    d.meta.defects.forEach(g=>{
      const caught=!missed.has(g.id);
      gtbox.append($(`<div class="finding ${g.severity}"><div class="head">
        <span class="sev ${g.severity}">${g.severity}</span>
        <div class="ft">${esc(g.description)}
          <div class="loc">${esc(g.file)}:${g.line} · ${esc(g.category)}</div></div>
        <span class="chip ${caught?'found':'miss'}">${caught?'✓ caught':'✗ missed'}</span>
      </div></div>`));
    });
    view.append(gtbox);
  }

  // diff
  view.append($(`<div><div class="spacer"></div><h2>The pull request (diff)</h2></div>`));
  view.append(renderDiff(d.diff));
}

function findingCard(f,sys,cid,idx){
  const v=f.verification||{};
  const card=$(`<div class="finding ${f.severity}">
    <div class="head">
      <span class="sev ${f.severity}">${f.severity}</span>
      <div class="ft">${esc(f.title)}<div class="loc">${esc(f.file)}:${f.line} · ${esc(f.category)}</div></div>
    </div>
    <div class="body">
      <div class="badges">
        ${f.reviewer?`<span class="chip">raised by ${esc(f.reviewer)}</span>`:''}
        ${v.verdict?`<span class="verdict ${v.verdict}">${v.verdict}</span>`:''}
        ${'_true' in f?`<span class="tp ${f._true?'real':'fp'}">${f._true?'matches a planted bug':'not a planted bug'}</span>`:''}
      </div>
      <div>${esc(f.description)}</div>
      ${v.evidence?`<div class="ev"><b>Verifier evidence (${esc(v.confidence||'')}):</b> ${esc(v.evidence)}</div>`:''}
    </div>
  </div>`);
  card.querySelector('.head').onclick=()=>card.classList.toggle('open');
  if(sys==='agent-v5' && f._trace && f._trace.length){
    const btn=$(`<button class="tracebtn">▶ watch the verifier attack this finding</button>`);
    btn.onclick=(e)=>{e.stopPropagation();location.hash=`#/verify/${cid}/${idx}`;};
    card.querySelector('.body').append(btn);
  }
  return card;
}

/* ---------- diff ---------- */
function renderDiff(diff){
  const box=$(`<div class="diff"></div>`);
  (diff||'').split('\n').forEach(l=>{
    let cls='';
    if(l.startsWith('+++')||l.startsWith('---'))cls='meta';
    else if(l.startsWith('@@'))cls='hh';
    else if(l.startsWith('+'))cls='add';
    else if(l.startsWith('-'))cls='del';
    else if(l.startsWith('diff ')||l.startsWith('index '))cls='meta';
    box.append($(`<span class="dl ${cls}">${esc(l)||' '}</span>`));
  });
  return box;
}

/* ---------- verification traces (the differentiator) ---------- */
function renderVerify(cid, idx){
  // default to the reopen-crash case (the money-shot reproduction), else first with traces
  const hasTrace=(id)=>{const s=DATA.detail[id]&&DATA.detail[id].systems['agent-v5'];return s&&s.findings.some(f=>f._trace&&f._trace.length);};
  if(!cid){ cid = (hasTrace('case21_perf_reports') && 'case21_perf_reports')
                 || DATA.cases.find(c=>hasTrace(c.id))?.id; }
  const d=cid?DATA.detail[cid]:null;
  view.innerHTML='';
  view.append($(`<div><div class="eyebrow">the part no other review tool shows</div>
    <h1>Verification traces</h1>
    <div class="sub">A reviewer <i>claiming</i> a bug is cheap. Here's the second agent that had to <b>prove each finding wrong</b> — in a fresh sandbox, with a shell — before it reached a human. Pick a case, then a finding, and watch it work.</div></div>`));

  // case picker
  const withTraces=DATA.cases.filter(c=>{const s=DATA.detail[c.id].systems['agent-v5'];return s&&s.findings.some(f=>f._trace&&f._trace.length);});
  const cpick=$(`<div class="selectrow"></div>`);
  withTraces.forEach(c=>{
    const on=c.id===cid;
    cpick.append($(`<button class="pick ${on?'on':''}" onclick="location.hash='#/verify/${c.id}'">
      ${esc(c.title)}<div class="loc">${esc(c.id)} · tier ${c.tier}</div></button>`));
  });
  view.append(cpick);
  if(!d) return;

  const v5=d.systems['agent-v5'];
  const traced=v5.findings.map((f,i)=>({f,i})).filter(x=>x.f._trace&&x.f._trace.length);
  let sel = idx!=null? +idx : (traced[0]?traced[0].i:null);

  const grid=$(`<div class="vgrid"></div>`);
  const leftWrap=$(`<div></div>`);
  const right=$(`<div class="rejlist"></div>`);
  grid.append(leftWrap,right);
  view.append(grid);

  // right: rejected findings (the noise thrown out)
  right.append($(`<div><h2 style="font-size:14px">What the verifier threw out</h2>
    <div class="note" style="margin:6px 0 12px">Findings a reviewer raised but the verifier could not confirm — the noise that never reaches you.</div></div>`));
  if(!v5.rejected || !v5.rejected.length){
    right.append($(`<div class="empty">Nothing rejected on this case — every raised finding survived.</div>`));
  } else v5.rejected.forEach(r=>{
    const rv=r.verification||{};
    right.append($(`<div class="rj"><div class="loc">${esc(r.file)}:${r.line}</div>
      <div style="margin:3px 0 5px;font-weight:600">${esc(r.title)}</div>
      <span class="verdict REJECTED">REJECTED</span>
      ${rv.evidence?`<div class="note" style="margin-top:7px">${esc(rv.evidence)}</div>`:''}</div>`));
  });

  // left: finding picker + the trace
  const fpick=$(`<div class="selectrow"></div>`);
  traced.forEach(({f,i})=>{
    fpick.append($(`<button class="pick ${i===sel?'on':''}" onclick="location.hash='#/verify/${cid}/${i}'">
      <span class="sev ${f.severity}" style="margin-right:6px">${f.severity}</span>${esc(f.title)}
      <div class="loc">${esc(f.file)}:${f.line}</div></button>`));
  });
  leftWrap.append(fpick);
  if(sel==null){ leftWrap.append($(`<div class="empty">Select a finding.</div>`)); return; }

  const f=v5.findings[sel], v=f.verification||{};
  leftWrap.append($(`<div class="vpanel">
    <div class="badges" style="margin-bottom:8px">
      ${f.reviewer?`<span class="chip">raised by ${esc(f.reviewer)} reviewer</span>`:''}
      <span class="verdict ${v.verdict||''}">${v.verdict||'—'}</span>
      ${'_true' in f?`<span class="tp ${f._true?'real':'fp'}">${f._true?'matches a planted bug':'not a planted bug'}</span>`:''}
    </div>
    <div style="font-weight:600;font-size:15px">${esc(f.title)}</div>
    <div class="loc" style="font-family:var(--mono);color:var(--accent);font-size:12.5px;margin:4px 0 2px">${esc(f.file)}:${f.line}</div>
    <div class="note" style="margin-top:8px">${esc(f.description)}</div>
  </div>`));
  leftWrap.append($(`<div><div class="spacer" style="height:14px"></div>
    <div class="eyebrow" style="margin-bottom:2px">the verifier's attempt to disprove it</div></div>`));
  leftWrap.append(renderTrace(f._trace));
}

function renderTrace(steps){
  const box=$(`<div class="trace"></div>`);
  steps.forEach(s=>{
    if(s.k==='say') box.append($(`<div class="step say"><div class="kind">reason</div><div class="content">${esc(s.text)}</div></div>`));
    else if(s.k==='tool') box.append($(`<div class="step tool"><div class="kind">run · ${esc(s.name)}</div><div class="content"><div class="cmd"><span class="tn">$</span> ${esc(s.arg)}</div></div></div>`));
    else if(s.k==='out'){ const err=/error|traceback|exception|already exists/i.test(s.text);
      box.append($(`<div class="step out"><div class="kind">output</div><div class="content"><div class="outbox ${err?'':''}">${err?highlightErr(s.text):esc(s.text)}</div></div></div>`)); }
    else if(s.k==='done') box.append($(`<div class="step done"><div class="kind">verdict</div><div class="content donebox">✓ returned after ${s.turns} turns · ${s.secs}s · $${(s.cost||0).toFixed(3)}</div></div>`));
  });
  return box;
}
function highlightErr(t){
  return esc(t).replace(/([A-Za-z.]*(Error|Exception)[^\n]*)/g,'<span class="err">$1</span>');
}

route();
</script>
