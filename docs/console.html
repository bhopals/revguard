<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>RevGuard Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0e1013; --panel:#15181e; --panel2:#1c2029; --panel3:#232833;
  --line:#2a2f3a; --line2:#333a47;
  --fg:#e7eaee; --muted:#8b94a3; --faint:#5c6472;
  --accent:#4fd6c9; --accent-dim:#2a6f6a; --accent-ink:#0b1817;
  --crit:#ff6b6b; --major:#f5a623; --minor:#9aa4b2; --pass:#54d18c; --rej:#6b7280;
  --add:#1c3a2a; --del:#3a1f24;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:15px;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-columns:250px 1fr;
  grid-template-rows:100vh}
::selection{background:var(--accent-dim);color:#fff}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);
  font-weight:600;font-size:17px;margin-bottom:18px;padding:0 8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent)}
.brand b{color:var(--accent)}
.navlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:16px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--muted);font-weight:500;font-size:14.5px;transition:.12s;text-align:left;width:100%}
.nav:hover{background:var(--panel2);color:var(--fg)}
.nav.active{background:var(--accent-ink);color:var(--accent)}
.nav .ic{width:16px;text-align:center;font-family:var(--mono)}
.side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:12px 8px 0;
  border-top:1px solid var(--line);line-height:1.5}

/* ---------- main ---------- */
.main{overflow:auto;padding:0}
.wrap{max-width:1080px;margin:0 auto;padding:34px 36px 80px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:0}
.sub{color:var(--muted);margin-top:4px;font-size:14.5px;line-height:1.5}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.spacer{height:26px}

/* cards & tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px}
.tile .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .l{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.3}
.tile.accent .n{color:var(--accent)} .tile.pass .n{color:var(--pass)} .tile.crit .n{color:var(--crit)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:500}
td{font-variant-numeric:tabular-nums}
tr.win td{background:var(--accent-ink)} tr.win .sys{color:var(--accent);font-weight:600}
.f1{font-weight:700}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:18px}
.casecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;text-align:left;transition:.14s;display:flex;flex-direction:column;gap:9px}
.casecard:hover{border-color:var(--accent-dim);transform:translateY(-2px);background:var(--panel2)}
.casecard .t{font-weight:600;font-size:15px;line-height:1.3}
.casecard .id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.casecard .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}

/* chips */
.chip{font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;
  border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.tier{border-color:var(--accent-dim);color:var(--accent)}
.chip.clean{border-color:var(--pass);color:var(--pass)}
.chip.found{border-color:var(--pass);color:var(--pass)}
.chip.miss{border-color:var(--crit);color:var(--crit)}
.sev{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;
  padding:3px 7px;border-radius:5px;color:#fff}
.sev.critical{background:var(--crit)} .sev.major{background:var(--major);color:#1a1205}
.sev.minor{background:var(--minor);color:#12151b}
.verdict{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
.verdict.CONFIRMED{background:var(--accent-ink);color:var(--accent);border:1px solid var(--accent-dim)}
.verdict.REJECTED{background:#242a2c;color:var(--rej);border:1px solid var(--line2)}
.tp{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px}
.tp.real{background:#10261c;color:var(--pass);border:1px solid var(--accent-dim)}
.tp.fp{background:#2a1b1f;color:var(--major);border:1px solid #5a3a22}

/* back link + breadcrumb */
.crumb{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;align-items:center}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--accent)}

/* finding cards */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.cases{grid-template-columns:1fr}}
.col h3{font-size:13px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between}
.finding{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  border-left:4px solid var(--line);margin-bottom:10px;overflow:hidden}
.finding.critical{border-left-color:var(--crit)} .finding.major{border-left-color:var(--major)}
.finding.minor{border-left-color:var(--minor)}
.finding .head{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.finding .head:hover{background:var(--panel2)}
.finding .ft{font-weight:600;font-size:14px;line-height:1.35;flex:1}
.finding .loc{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:3px}
.finding .body{padding:0 14px 14px;display:none;font-size:13.5px;line-height:1.5;color:var(--fg)}
.finding.open .body{display:block}
.finding .badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.ev{background:var(--panel3);border-radius:8px;padding:10px 12px;margin-top:10px;
  font-size:12.5px;line-height:1.5;color:var(--muted);border-left:2px solid var(--accent-dim)}
.ev b{color:var(--fg)}
.tracebtn{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--accent);
  border:1px solid var(--accent-dim);border-radius:7px;padding:6px 11px;display:inline-flex;gap:6px}
.tracebtn:hover{background:var(--accent-ink)}
.empty{color:var(--faint);font-style:italic;padding:14px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}

/* diff */
.diff{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-top:8px}
.diff .dl{padding:1px 14px;white-space:pre;display:block}
.diff .add{background:var(--add);color:#a6e6bf} .diff .del{background:var(--del);color:#f0a9b2}
.diff .hh{color:var(--accent);background:var(--panel2)} .diff .meta{color:var(--faint)}

/* trace */
.trace{margin-top:16px;display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:none}
.step .kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.step.say .kind{color:var(--muted)} .step.tool .kind{color:var(--accent)}
.step.out .kind{color:var(--faint)} .step.done .kind{color:var(--pass)}
.step .content{font-size:13.5px;line-height:1.55}
.step.say .content{color:var(--fg)}
.cmd{font-family:var(--mono);font-size:12.5px;background:#0b0d11;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;white-space:pre-wrap;color:#cbd3dd;overflow-x:auto}
.cmd .tn{color:var(--accent)}
.outbox{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;white-space:pre-wrap;color:var(--muted);max-height:220px;overflow:auto}
.outbox .err{color:var(--crit)}
.donebox{font-family:var(--mono);font-size:12.5px;color:var(--pass)}

/* verify header panel */
.vpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;margin-top:16px}
.vgrid>*{min-width:0}
.cols>*{min-width:0}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.rejlist .rj{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;margin-bottom:9px;font-size:13px}
.rejlist .rj .loc{font-family:var(--mono);font-size:11.5px;color:var(--major)}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.kbd{font-family:var(--mono);font-size:11px;background:var(--panel3);border:1px solid var(--line2);
  border-radius:5px;padding:1px 6px;color:var(--muted)}
.selectrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  font-size:13px;text-align:left;transition:.12s}
.pick:hover{border-color:var(--accent-dim)} .pick.on{border-color:var(--accent);background:var(--accent-ink);color:var(--accent)}
.pick .loc{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pick.on .loc{color:var(--accent)}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="dot"></span>Rev<b>Guard</b></div>
  <div class="navlabel">Console</div>
  <button class="nav" data-route="overview"><span class="ic">▤</span> Overview</button>
  <button class="nav" data-route="cases"><span class="ic">◧</span> Cases &amp; findings</button>
  <button class="nav" data-route="verify"><span class="ic">✓</span> Verification traces</button>
  <div class="foot">
    Every number and trace here is read from the committed
    <span class="kbd">results/</span> and <span class="kbd">trajectories/</span>.
    Rebuild with <span class="kbd">make console</span>.
  </div>
</aside>
<main class="main"><div class="wrap" id="view"></div></main>

<script>
const DATA = {"comparison":[{"system":"baseline","cases":22,"recall":0.951,"precision":0.906,"f1":0.928,"found":"58/61","fp":6,"clean_fp":0,"avg_s":39.6,"avg_cost":0.053},{"system":"agent-v1","cases":22,"recall":0.656,"precision":0.976,"f1":0.784,"found":"40/61","fp":1,"clean_fp":0,"avg_s":45.7,"avg_cost":0.096},{"system":"agent-v2","cases":22,"recall":0.721,"precision":0.846,"f1":0.779,"found":"44/61","fp":8,"clean_fp":0,"avg_s":46.7,"avg_cost":0.23},{"system":"agent-v3","cases":22,"recall":0.721,"precision":0.815,"f1":0.765,"found":"44/61","fp":10,"clean_fp":0,"avg_s":79.3,"avg_cost":0.391},{"system":"agent-v4","cases":22,"recall":0.836,"precision":0.81,"f1":0.823,"found":"51/61","fp":12,"clean_fp":0,"avg_s":105.2,"avg_cost":0.545},{"system":"agent-v5","cases":22,"recall":0.836,"precision":0.944,"f1":0.887,"found":"51/61","fp":3,"clean_fp":0,"avg_s":110.3,"avg_cost":0.501}],"tier3":{"baseline":{"found":19,"gt":22,"recall":0.86,"precision":0.9,"f1":0.884,"fp":2},"agent-v5":{"found":20,"gt":22,"recall":0.91,"precision":0.95,"f1":0.93,"fp":1}},"cases":[{"id":"case01_csv_export","title":"Add CSV export for expenses","tier":1,"clean":false,"gt":2,"pr_description":"Adds a new export module so users can download their expenses as a CSV file. Supports an optional category filter and writes into an exports/ directory using the caller-supplied filename."},{"id":"case02_float_money","title":"Simplify money parsing","tier":1,"clean":false,"gt":3,"pr_description":"Replaces the regex-based amount parser with a much simpler float() based implementation and updates the parser tests to match. Less code, same behavior for normal inputs."},{"id":"case03_pagination","title":"Configurable page size for expense listing","tier":1,"clean":false,"gt":2,"pr_description":"Lets API callers choose a page size when listing expenses and adds a page_count helper so clients can render pagination controls."},{"id":"case04_token_refresh","title":"Sliding session expiry via token refresh","tier":1,"clean":false,"gt":3,"pr_description":"Adds refresh_token() so clients can extend a session without re-entering a password. Includes a test for the new endpoint."},{"id":"case05_new_categories","title":"Add education and travel categories","tier":1,"clean":true,"gt":0,"pr_description":"Adds two frequently requested expense categories, with a regression test that both are accepted and unknown categories are still rejected."},{"id":"case06_budget_alerts","title":"Budget alert threshold","tier":1,"clean":false,"gt":2,"pr_description":"Adds budget_alerts() which flags every category whose spend has reached a configurable percentage of its monthly budget (default 80%), so the UI can warn users before they go over."},{"id":"case07_password_reset","title":"Password reset codes","tier":1,"clean":false,"gt":5,"pr_description":"Adds a two-step password reset flow: request_password_reset() issues a 6-digit code (delivery handled by the caller, e.g. email), and reset_password() sets a new password when the code matches."},{"id":"case08_bulk_import","title":"Bulk expense import","tier":1,"clean":false,"gt":2,"pr_description":"Adds import_expenses() so users can migrate data from other apps. Takes a list of row dicts (as parsed from CSV/JSON uploads) and returns how many were imported, skipping rows that fail validation."},{"id":"case09_report_refactor","title":"Deduplicate budget queries in reports","tier":1,"clean":true,"gt":0,"pr_description":"Pure refactor: extracts the repeated budget-row query into a _budgets_for_month helper and tidies naming. No behavior change intended."},{"id":"case10_note_search","title":"Search expenses by note","tier":1,"clean":false,"gt":2,"pr_description":"Adds search_expenses() so users can find expenses by note text, with a configurable sort column for the results."},{"id":"case11_budget_rollover","title":"Roll unused budget into the next month","tier":1,"clean":false,"gt":3,"pr_description":"Frequently requested feature: at month end, carry each category's unspent budget into the next month. Adds a next_month helper and rollover_budgets(), plus a test."},{"id":"case12_account_deletion","title":"Bulk delete and account deletion","tier":1,"clean":false,"gt":2,"pr_description":"Adds delete_expenses_bulk() for multi-select delete in the UI and delete_account() for GDPR-style full account removal."},{"id":"case13_cli","title":"Command-line interface for Ledgerly","tier":2,"clean":false,"gt":4,"pr_description":"Adds a ledgerly CLI with register, login, add, list and summary commands so the service can be used without writing Python. Token is cached in the user's home directory between invocations."},{"id":"case14_multi_currency","title":"Multi-currency expenses","tier":2,"clean":false,"gt":3,"pr_description":"Lets users record expenses in a currency other than USD. Adds a currency column (default USD) and a currency parameter to add_expense, with a test covering the new parameter. Reporting is unchanged."},{"id":"case15_summary_cache","title":"Cache monthly summaries","tier":2,"clean":false,"gt":4,"pr_description":"monthly_summary is the hottest query in the dashboard, so cache its result per (user, month). Includes a test showing the cache returns consistent results."},{"id":"case16_top_categories","title":"Top spending categories widget","tier":2,"clean":false,"gt":2,"pr_description":"Adds top_categories() for the dashboard widget: the user's n biggest categories for a month, formatted for display. Ties are broken alphabetically for stable rendering."},{"id":"case17_api_export","title":"CSV export endpoint + household API","tier":3,"clean":false,"gt":4,"pr_description":"Adds GET /export (download expenses as CSV), and first household endpoints: GET /household/balances and POST /household/expenses. Also tidies the handler layer: field validation renamed to _require_fields and route registrations grouped by resource."},{"id":"case18_import_v2","title":"Importer v2: category mapping and atomic batches","tier":3,"clean":false,"gt":4,"pr_description":"Statement import learns two things users kept asking for: map merchant descriptions to categories (case-insensitive prefix rules, e.g. 'COFFEE' -> food), and all-or-nothing batches so a bad row no longer leaves a half-imported statement. Duplicate detection was also simplified and sped up by keying on (date, amount)."},{"id":"case19_household_invites","title":"Household invite codes","tier":3,"clean":false,"gt":3,"pr_description":"Owners can now invite people without knowing their user id: create_invite() issues a short shareable code, accept_invite() joins the caller to the household. Includes schema and tests."},{"id":"case20_recurring_v2","title":"Recurring rules: biweekly cadence and pause/resume","tier":3,"clean":false,"gt":4,"pr_description":"Adds the two most requested recurring-rule features: a biweekly cadence (every second week on a weekday) and pause/resume so users can suspend a subscription rule while keeping its history. Tests included for both."},{"id":"case21_perf_reports","title":"Report performance: single-query budget status","tier":3,"clean":false,"gt":3,"pr_description":"budget_status did 1 + N queries (a summary plus one per budget). This PR collapses it into a single LEFT JOIN aggregate, adds a covering index for the expense lookup path, and relaxes sqlite synchronous mode for faster writes. No behavior change intended."},{"id":"case22_notifications_api","title":"Notifications API + weekly digest job","tier":3,"clean":false,"gt":4,"pr_description":"Exposes notifications over the API (list unread, mark read) and adds send_weekly_digests(), the scheduled job that mails every user a spending digest for the month and tidies up their notification list."}],"detail":{"case01_csv_export":{"meta":{"title":"Add CSV export for expenses","tier":1,"clean":false,"pr_description":"Adds a new export module so users can download their expenses as a CSV file. Supports an optional category filter and writes into an exports/ directory using the caller-supplied filename.","defects":[{"id":"c01-d1","file":"ledgerly/export.py","line":18,"severity":"critical","category":"security","description":"Category filter is interpolated into the SQL string with an f-string instead of a bound parameter, allowing SQL injection through the category argument."},{"id":"c01-d2","file":"ledgerly/export.py","line":12,"severity":"major","category":"security","description":"Caller-supplied filename is joined to the export directory without sanitization, so names like '../../etc/x' escape the exports directory (path traversal)."}]},"diff":"--- a/ledgerly/export.py\n+++ b/ledgerly/export.py\n@@ -0,0 +1,31 @@\n+\"\"\"CSV export for a user's expenses.\"\"\"\n+\n+import csv\n+import os\n+\n+EXPORT_DIR = \"exports\"\n+\n+\n+def export_expenses_csv(db, user_id, filename, category=None):\n+    \"\"\"Write the user's expenses to exports/<filename> and return the path.\"\"\"\n+    os.makedirs(EXPORT_DIR, exist_ok=True)\n+    path = os.path.join(EXPORT_DIR, filename)\n+    sql = (\n+        \"SELECT spent_on, category, amount_cents, note FROM expenses\"\n+        \" WHERE user_id = ?\"\n+    )\n+    if category is not None:\n+        sql += f\" AND category = '{category}'\"\n+    sql += \" ORDER BY spent_on\"\n+    rows = db.query(sql, (user_id,))\n+    with open(path, \"w\", newline=\"\") as fh:\n+        writer = csv.writer(fh)\n+        writer.writerow([\"date\", \"category\", \"amount\", \"note\"])\n+        for r in rows:\n+            writer.writerow([\n+                r[\"spent_on\"],\n+                r[\"category\"],\n+                f\"{r['amount_cents'] / 100:.2f}\",\n+                r[\"note\"],\n+            ])\n+    return path\n","systems":{"baseline":{"findings":[{"file":"ledgerly/export.py","line":16,"category":"security","title":"SQL injection via category filter","severity":"critical","description":"The category parameter is interpolated directly into the SQL string with an f-string instead of being passed as a bound parameter, allowing arbitrary SQL injection through the category argument (e.g. category=\"' OR '1'='1\" or a UNION-based attack) if it originates from user input.","_true":true,"_trace":null},{"file":"ledgerly/export.py","line":12,"category":"security","title":"Path traversal via caller-supplied filename","severity":"critical","description":"filename is joined into the export path with os.path.join without any sanitization. A filename containing path separators or '..' segments (e.g. '../../etc/cron.d/evil' or an absolute path like '/etc/passwd') can escape the exports/ directory and let the caller write/overwrite arbitrary files on the filesystem.","_true":true,"_trace":null},{"file":"ledgerly/export.py","line":9,"category":"test-adequacy","title":"No tests included for new export module","severity":"major","description":"The PR adds a new public function (export_expenses_csv) with filtering logic, file I/O, and SQL construction, but no unit tests are included to verify correct CSV output, category filtering behavior, or handling of edge cases (empty result set, missing filename extension, special characters in notes, etc.).","_true":true,"_trace":null},{"file":"ledgerly/export.py","line":12,"category":"robustness","title":"Existing files silently overwritten","severity":"minor","description":"Opening the target path with mode 'w' silently overwrites any pre-existing file at that path with no check or warning, which combined with the unsanitized filename could destroy existing data at attacker-chosen locations.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":11.0,"cost_usd":0.020459800000000004,"raw":null,"found":2,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/export.py","line":18,"category":"security","title":"SQL injection via category parameter","severity":"critical","description":"The `category` argument is interpolated directly into the SQL string with an f-string instead of being passed as a bo nts%100 integer arithmetic; reports.py/budget_status likewise operates purely on integer cents. export.py:28 instead does r['amount_cents']/100 formatted with :.2f. Wrote a Python script comparing the exact integer-based formatting vs the float-division formatting across many amount_cents values; for magnitudes below ~10^16 they always agreed, but starting at 10^16 (e.g. 10000000000000001, 10000000000000004, ...) the float-division output diverges from the exact value (e.g. '100000000000000.01' vs '100000000000000.02'), confirming genuine precision loss. There is no upper bound on amount_cents in the schema (INTEGER) or in parse_money (regex just requires digits + optional 2-decimal fraction, only checks total>0), so a user-supplied amount at this magnitude is reachable through the normal add_expense/parse_money path, making the divergence a real (if practically extreme) reachable bug, not merely theoretical.","adjusted_severity":"minor"},"severity":"minor","_true":false,"_trace":[{"k":"tool","name":"Bash","arg":"sed -n '1,20p' ledgerly/db.py && echo --- && cat ledgerly/utils.py && echo --- && cat ledgerly/reports.py 2>/dev/null | head -50"},{"k":"out","text":"\"\"\"SQLite persistence layer.\n\nAll amounts are stored as integer cents to avoid floating point drift.\n\"\"\"\n\nimport sqlite3\nfrom contextlib import contextmanager\n\nSCHEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS users (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    username TEXT NOT NULL UNIQUE,\n    password_hash TEXT NOT NULL,\n    salt TEXT NOT NULL,\n    created_at TEXT NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS expenses (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    user_id INTEGER NOT NULL REFERENCES users(id),\n---\n\"\"\"Parsing and formatting helpers.\n\nMoney is always integer cents internally. Parsing accepts \"12.50\", \"12\",\n\"$12.50\". Dates are ISO \"YYYY-MM-DD\"; months are \"YYYY-MM\".\n\"\"\"\n\nimport re\nfrom d\n\u2026 (+2852 chars)"},{"k":"tool","name":"Bash","arg":"python3 - c02-d1","file":"ledgerly/utils.py","line":20,"severity":"critical","category":"correctness","description":"Converting via float and truncating with int() loses cents to binary floating point error: parse_money('19.99') returns 1998 instead of 1999. Money must not round-trip through float."},{"id":"c02-d2","file":"ledgerly/utils.py","line":17,"severity":"major","category":"robustness","description":"float() accepts inputs the old parser rejected: negatives ('-5'), sub-cent precision ('12.345'), scientific notation ('1e5'), 'nan' and 'inf'. The positive-amount and two-decimal guarantees are silently dropped."},{"id":"c02-d3","file":"tests/test_ledgerly.py","line":28,"severity":"major","category":"test-adequacy","description":"The PR weakens the regression test by removing the '-5' and '12.345' rejection cases so the new permissive parser still passes. Tests were edited to fit the bug instead of catching it."}]},"diff":"--- a/ledgerly/utils.py\n+++ b/ledgerly/utils.py\n@@ -4,28 +4,20 @@\n \"$12.50\". Dates are ISO \"YYYY-MM-DD\"; months are \"YYYY-MM\".\n \"\"\"\n \n-import re\n from datetime import date, datetime, timezone\n-\n-_MONEY_RE = re.compile(r\"^\\$?(\\d+)(?:\\.(\\d{1,2}))?$\")\n \n \n def parse_money(text):\n     \"\"\"Parse a user-supplied amount into integer cents.\n \n-    Raises ValueError on malformed input or negative/zero amounts.\n+    Raises ValueError on malformed input.\n     \"\"\"\n-    text = text.strip()\n-    m = _MONEY_RE.match(text)\n-    if not m:\n+    text = text.strip().lstrip(\"$\")\n+    try:\n+        dollars = float(text)\n+    except ValueError:\n         raise ValueError(f\"invalid amount: {text!r}\")\n-    dollars = int(m.group(1))\n-    frac = m.group(2) or \"0\"\n-    cents = int(frac) if len(frac) == 2 else int(frac) * 10\n-    total = dollars * 100 + cents\n-    if total <= 0:\n-        raise ValueError(\"amount must be positive\")\n-    return total\n+    return int(dollars * 100)\n \n \n def format_money(cents):\n\n--- a/tests/test_ledgerly.py\n+++ b/tests/test_ledgerly.py\n@@ -25,7 +25,7 @@\n         assert parse_money(\"0.5\") == 50\n \n     def test_parse_money_rejects_garbage(self):\n-        for bad in [\"\", \"abc\", \"-5\", \"12.345\", \"1,000\"]:\n+        for bad in [\"\", \"abc\", \"1,000\"]:\n             with pytest.raises(ValueError):\n                 parse_money(bad)\n \n","systems":{"baseline":{"findings":[{"file":"ledgerly/utils.py","line":20,"category":"correctness","severity":"critical","title":"Negative and zero amounts are now accepted","description":"The removed `if total <= 0: raise ValueError(...)` check is not replaced. `float(\"-5\")` and `float(\"0\")` parse successfully, so parse_money(\"-5\") now returns -500 and parse_money(\"0\") returns 0 instead of raising, silently allowing negative/zero expense amounts into the ledger. The removed test case for \"-5\" masks this regression.","_true":true,"_trace":null},{"file":"ledgerly/utils.py","line":20,"category":"correctness","severity":"critical","title":"Floating-point rounding errors corrupt monetary values","description":"Using float() and `int(dollars * 100)` for currency is unsafe: many decimal amounts are not exactly representable in binary floating point (e.g. 19.99 * 100 can evaluate to 1998.9999999999998), and int() truncates rather than rounds, so parse_money can silently return the wrong number of cents for common, valid inputs. The previous regex+integer-arithmetic approach avoided this entirely.","_true":true,"_trace":null},{"file":"ledgerly/utils.py","line":20,"category":"correctness","severity":"major","title":"Excess fractional digits are silently truncated instead of rejected","description":"The old regex limited the fractional part to 1-2 digits and rejected anything else (e.g. \"12.345\" raised ValueError). The new implementation accepts \"12.345\" as float 12.345, multiplies to 1234.5 and truncates to 1234 cents, silently discarding a half-cent instead of signalling malformed input. This changes documented/tested behavior without the PR describing it as a behavior change.","_true":true,"_trace":null},{"file":"ledgerly/utils.py","line":17,"category":"robustness","severity":"major","title":"Non-ValueError exceptions can escape for inf/overflow inputs","description":"float(\"inf\") or float(\"1e400\") parse successfully (no ValueError raised by float()), but `int(dollars * 100)` on an infinite value raises OverflowError, not ValueError, which is not caught by the try/except and propagates uncontrolled, violating the function's documented contract of raising ValueError on malformed input.","_true":true,"_trace":null},{"file":"ledgerly/utils.py","line":15,"category":"correctness","severity":"minor","title":"float() accepts formats the old parser rejected (scientific notation, underscores)","description":"Because parsing now delegates to Python's float(), strings like \"1e3\" or \"1_000\" are accepted as valid amounts (parsed as 1000.0), whereas the previous strict regex only accepted plain digits with an optional 1-2 digit fraction. This widens accepted input formats beyond what the docstring (\"$12.50\" style) and tests describe, which could let unexpected client input through.","_true":true,"_trace":null},{"file":"tests/test_ledgerly.py","line":28,"category":"test-adequacy","severity":"major","title":"Regression tests for negative amounts and extra decimal digits were deleted, not updated","description":"The PR removes \"-5\" and \"12.345\" from the rejection test list instead of asserting the new (and arguably incorrect) behavior. This hides the negative/zero-amount regression and the silent-truncation regression described above, since no test exercises these inputs at all anymore.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":48.0,"cost_usd":0.059321799999999994,"raw":null,"found":3,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/utils.py","line":20,"category":"correctness","title":"Floating-point multiplication causes off-by-one-cent errors for common amounts","severity":"critical","description":"parse_money now computes cents as int(float(text) * 100). Because decimal fractions like 19.99, 3.35, 8.29, etc. cannot be represented exactly in binary floating point, dollars*100 often lands just below the intended integer (e.g. 19.99*100 == 1998.9999999999998, 3.35*100 == 334.99999999999994). int() truncates toward zero rather than rounding, so parse_money('19.99') returns 1998 cents instead of 1999. Since db.py explicitly stores amounts as integer cents 'to avoid floating point drift' (ledgerly/db.py:3), this reintroduces exactly the drift the schema was designed to prevent, silently under-recording real user-entered expense/budget amounts by a cent. The PR's test additions (12.50, 12, 0.5) all happen to be exact in binary float, so this regression is untested.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Ran python3 against post-PR ledgerly/utils.py: parse_money('19.99') returns 1998 (should be 1999), parse_money('8.29') returns 828 (should be 829), due to int(float(text)*100) truncating values like 19.99*100==1998.9999999999998 and 8.29*100==828.9999999999999 toward zero instead of rounding. Confirmed db.py:3 states amounts are stored as integer cents 'to avoid floating point drift', so this reintroduces the exact bug the schema design intended to prevent. The PR's own test additions (12.50, 12, 0.5) are all exact in binary float and don't catch this, matching the claim.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"python3 -c \"\nfrom ledgerly.utils import parse_money\nprint(parse_money('19.99'))\nprint(parse_money('3.35'))\nprint(parse_money('8.29'))\nprint(19.99*100)\n\"\n"},{"k":"out","text":"1998\n335\n828\n1998.9999999999998"},{"k":"tool","name":"Bash","arg":"python3 -c \"\nprint(float('3.35')*100)\nprint(int(float('3.35')*100))\nprint(float('8.29')*100)\nprint(int(float based implementation, parse_money(\"-5\") succeeds and returns -500 (float(\"-5\") == -5.0, int(-5.0*100) == -500) instead of raising, a real behavioral regression versus the old parser and versus what callers (e.g. expenses.add_expense) likely assume about positive amounts. By dropping this case instead of updating it to assert the new (broken) behavior or keep the old contract, the test can no longer catch this regression.","reviewer":"tests","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Ran `parse_money(\"-5\")` against the post-PR code: it returns -500 instead of raising ValueError, confirming the new float()-based implementation no longer rejects negative amounts (the old docstring explicitly promised 'negative/zero amounts' raise ValueError, and the old regex-based parser enforced total<=0 check). The diff shows tests/test_ledgerly.py:28 removed \"-5\" from the rejects_garbage list rather than updating it to assert the new (broken) behavior, so pytest now passes despite the regression. Verified test currently passes with `pytest -k rejects_garbage`. This is a real production code defect (parse_money accepting negative amounts), not just a coverage gap, and the test change actively conceals it.","adjusted_severity":"major"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"python3 -c \"\nfrom ledgerly.utils import parse_money\nfor v in ['-5', '12.345']:\n    try:\n        r = parse_money(v)\n        print(v, '->', r)\n    except ValueError as e:\n        print(v, 'raises', e)\n\"\n"},{"k":"out","text":"-5 -> -500\n12.345 -> 1234"},{"k":"tool","name":"Bash","arg":"grep -rn \"parse_money\" ledgerly/*.py | grep -v test"},{"k":"out","text":"ledgerly/utils.py:10:def parse_money(text):"},{"k":"tool","name":"Bash","arg":"grep -rn \"parse_money\\|add_expense\" ledgerly/expenses.py 2>/dev/null || find . -iname \"expenses*\""},{"k":"out","text":"ledgerly/expenses.py:18:def add_expense(db, user_id, amount_cents, category, spent_on, note=\"\") 41 chars)"},{"k":"done","turns":5,"cost":0.0443612,"secs":16.3}]}],"rejected":[],"stages":[{"stage":"reviewer_correctness","findings":4,"seconds":74.7,"cost_usd":0.1402872},{"stage":"reviewer_security","findings":0,"seconds":53.8,"cost_usd":0.11847340000000002},{"stage":"reviewer_tests","findings":2,"seconds":26.4,"cost_usd":0.052403599999999995},{"stage":"verifier","in":2,"confirmed":2,"seconds":17.2}],"seconds":91.9,"cost_usd":0.3952,"raw":6,"found":2,"missed":["c02-d2"],"false_positives":0}}},"case03_pagination":{"meta":{"title":"Configurable page size for expense listing","tier":1,"clean":false,"pr_description":"Lets API callers choose a page size when listing expenses and adds a page_count helper so clients can render pagination controls.","defects":[{"id":"c03-d1","file":"ledgerly/expenses.py","line":62,"severity":"major","category":"correctness","description":"page_count is off by one when the total is an exact multiple of the page size: 40 items at 20 per page reports 3 pages. Should be ceil division, e.g. (total + page_size - 1) // page_size, with the zero-items case handled."},{"id":"c03-d2","file":"ledgerly/expenses.py","line":67,"severity":"major","category":"robustness","description":"page_size is never validated. In SQLite, LIMIT -1 means 'no limit', so a caller passing page_size=-1 dumps the user's entire table in one response; 0 or huge values are also accepted silently."}]},"diff":"--- a/ledgerly/expenses.py\n+++ b/ledgerly/expenses.py\n@@ -47,7 +47,22 @@\n     )\n \n \n-def list_expenses(db, user_id, category=None, page=1):\n+def count_expenses(db, user_id, category=None):\n+    \"\"\"Total number of the user's expenses, optionally within a category.\"\"\"\n+    sql = \"SELECT COUNT(*) AS n FROM expenses WHERE user_id = ?\"\n+    params = [user_id]\n+    if category is not None:\n+        sql += \" AND category = ?\"\n+        params.append(category)\n+    return db.query_one(sql, tuple(params))[\"n\"]\n+\n+\n+def page_count(total, page_size=PAGE_SIZE):\n+    \"\"\"Number of pages needed to show `total` items.\"\"\"\n+    return total // page_size + 1\n+\n+\n+def list_expenses(db, user_id, category=None, page=1, page_size=PAGE_SIZE):\n     \"\"\"Return one page of the user's expenses, newest first.\"\"\"\n     if page < 1:\n         raise ExpenseError(\"page must be >= 1\")\n@@ -57,5 +72,5 @@\n         sql += \" AND category = ?\"\n         params.append(category)\n     sql += \" ORDER BY spent_on DESC, id DESC LIMIT ? OFFSET ?\"\n-    params += [PAGE_SIZE, (page - 1) * PAGE_SIZE]\n+    params += [page_size, (page - 1) * page_size]\n     return [dict(r) for r in db.query(sql, tuple(params))]\n","systems":{"baseline":{"findings":[{"file":"ledgerly/expenses.py","line":62,"category":"correctness","severity":"major","title":"page_count off-by-one for exact multiples","description":"page_count computes `total // page_size + 1`, which always adds an extra page. For total=10, page_size=10 this returns 2 pages instead of 1, and for total=0 it returns 1 instead of 0. Clients using this to render pagination controls will show a bogus trailing empty page (or a page when there are no items). The correct formula is ceiling division with a total=0 special case, e.g. `(total + page_size - 1) // page_size` (and 0 when total is 0).","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":62,"category":"robustness","severity":"minor","title":"page_count crashes on page_size <= 0","description":"page_count performs `total // page_size` with no validation of page_size. A caller passing page_size=0 gets a ZeroDivisionError, and a negative page_size silently produces a nonsensical negative-ish result. There is no guard analogous to the page>=1 check in list_expenses.","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":65,"category":"security","severity":"major","title":"list_expenses accepts unvalidated page_size, allowing full-table dumps","description":"The new page_size parameter is passed straight into `LIMIT ? OFFSET ?` with no bounds checking. SQLite treats a negative LIMIT as 'no limit', so a caller passing page_size <= -1 defeats pagination entirely and can retrieve every expense row for a user in one call, bypassing the intended page-size control. There is also no upper bound, so an arbitrarily large page_size can be requested, leading to unbounded memory/row fetches per call (resource-exhaustion risk) \u2014 unlike the old code where PAGE_SIZE was a fixed constant.","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":65,"category":"test-adequacy","severity":"minor","title":"No tests for new pagination behavior","description":"The diff adds count_expenses, page_count, and the page_size parameter to list_expenses but includes no accompanying tests for these code paths (e.g. exact-multiple totals, zero totals, custom page_size values, or invalid page_size). Given page_count has an off-by-one bug and list_expenses has no page_size validation, tests would likely have caught both defects.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":27.1,"cost_usd":0.040306800000000004,"raw":null,"found":2,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/expenses.py","line":62,"category":"correctness","severity":"major","title":"page_count off-by-one for exact multiples of page_size","description":"page_count computes `total // page_size + 1`, which always adds one extra page. For total=40 and page_size=20 (exactly 2 full pages), this returns 3 instead of 2. For total=0, it returns 1 page instead of 0. The correct ceiling-division formula is `(total + page_size - 1) // page_size` (with a special case for total=0 if 0 pages is desired). Any client using this helper to render pagination controls will always show one bogus extra page, and for zero expenses it will show a page 1 that contains no results, contradicting the docstring 'Number of pages needed to show `total` items.'","reviewer":"correctness","verification":{"ve .2996,"raw":3,"found":1,"missed":["c03-d2"],"false_positives":0}}},"case04_token_refresh":{"meta":{"title":"Sliding session expiry via token refresh","tier":1,"clean":false,"pr_description":"Adds refresh_token() so clients can extend a session without re-entering a password. Includes a test for the new endpoint.","defects":[{"id":"c04-d1","file":"ledgerly/auth.py","line":70,"severity":"critical","category":"security","description":"The UPDATE has no WHERE clause, so refreshing one session extends the expiry of every token in the system, including other users' sessions."},{"id":"c04-d2","file":"ledgerly/auth.py","line":68,"severity":"major","category":"correctness","description":"Uses naive local time instead of timezone.utc. The stored naive ISO string later makes authenticate() compare naive vs aware datetimes and raise TypeError, breaking every refreshed session on next use."},{"id":"c04-d3","file":"tests/test_ledgerly.py","line":60,"severity":"major","category":"test-adequacy","description":"The added test only asserts refresh_token returns the token. It never authenticates afterwards or checks the expiry moved, so it passes despite both bugs above."}]},"diff":"--- a/ledgerly/auth.py\n+++ b/ledgerly/auth.py\n@@ -62,6 +62,17 @@\n     return token\n \n \n+def refresh_token(db, token):\n+    \"\"\"Extend a valid session token's lifetime by TOKEN_TTL_HOURS.\"\"\"\n+    authenticate(db, token)\n+    new_expiry = datetime.now() + timedelta(hours=TOKEN_TTL_HOURS)\n+    db.execute(\n+        \"UPDATE tokens SET expires_at = ?\",\n+        (new_expiry.replace(microsecond=0).isoformat(),),\n+    )\n+    return token\n+\n+\n def authenticate(db, token):\n     \"\"\"Resolve a token to a user id, enforcing expiry.\"\"\"\n     row = db.query_one(\n\n--- a/tests/test_ledgerly.py\n+++ b/tests/test_ledgerly.py\n@@ -55,6 +55,10 @@\n         with pytest.raises(auth.AuthError):\n             auth.register(db, \"alice\", \"anotherpass\")\n \n+    def test_refresh_token(self, db, user 0000000002,"raw":null,"found":3,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/auth.py","line":69,"category":"correctness","title":"UPDATE tokens missing WHERE clause updates every session in the table","severity":"critical","description":"The UPDATE statement `UPDATE tokens SET expires_at = ?` has no WHERE token = ? clause, so calling refresh_token() for one user's token extends the expires_at of every token row in the tokens table for every logged-in user. Concretely: user A logs in (token A, expiry T+24h), user B logs in (token B, expiry T+24h). If A calls refresh_token(db, tokenA), B's token expiry is also silently reset to now+24h, and this happens on every refresh call by any user. The single-user test (test_refresh_token) only ever has one row in the tokens table, so it cannot detect this \u2014 with two or more concurrent sessions the bug corrupts other users' session expiry, defeating expiry-based session invalidation entirely.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/auth.py lines 65-73: refresh_token() executes `UPDATE tokens SET expires_at = ?` with only one bound parameter and no WHERE clause. Reproduced with python3 -c script: registered alice and bob, logged both in (two distinct token rows with distinct expires_at), called auth.refresh_token(db, tokenA), then re-queried both rows. Bob's (untouched user's) expires_at changed from '2026-08-30T14:40:44+00:00' to '2026-08-30T10:40:44', identical to Alice's new expiry \u2014 proving the UPDATE hits every row in the tokens table, not just the refreshed token. Confirmed the single-session test_refresh_token still passes (1 passed) since it only ever has one token row, matching the reviewer's explanation for why the existing test doesn't catch it. This is a genuine runtime defect in the shipped code (not just missing test coverage) that defeats per-session expiry for any deployment with concurrent users.","adjust t_cents\"],\n         })\n     return out\n+\n+\n+def budget_alerts(db, user_id, month, threshold_pct=ALERT_THRESHOLD_PCT):\n+    \"\"\"Categories whose spend has reached threshold_pct of their budget.\"\"\"\n+    spend = monthly_summary(db, user_id, month)\n+    budgets = db.query(\n+        \"SELECT category, limit_cents FROM budgets\"\n+        \" WHERE user_id = ? AND month = ?\",\n+        (user_id, month),\n+    )\n+    alerts = []\n+    for b in budgets:\n+        spent = spend.get(b[\"category\"], 0)\n+        pct = spent // b[\"limit_cents\"] * 100\n+        if pct > threshold_pct:\n+            alerts.append({\n+                \"category\": b[\"category\"],\n+                \"percent\": pct,\n+                \"spent\": format_money(spent),\n+                \"limit\": format_money(b[\"limit_cents\"]),\n+            })\n+    return alerts\n","systems":{"baseline":{"findings":[{"file":"ledgerly/reports.py","line":73,"category":"correctness","severity":"critical","title":"Integer division truncates before multiplying by 100","description":"`spent // b[\"limit_cents\"] * 100` performs integer division first, so pct is 0 for any spend below 100% of the limit (e.g. spent=8000, limit=10000 gives pct=0 instead of 80). This makes the alert essentially only fire once spend has reached at least the full budget (>=100%, since anything below rounds to 0), defeating the purpose of an early warning at 80%. Should be `spent * 100 // limit_cents` or use float division.","_true":true,"_trace":null},{"file":"ledgerly/reports.py","line":74,"category":"correctness","severity":"major","title":"Threshold comparison excludes the boundary","description":"The description says alerts should fire for categories that have 'reached' the threshold percentage, implying >=, but the code uses `pct > threshold_pct`, so a category exactly at 80% (or exactly at 100%, i.e. exactly over budget) is not flagged.","_true":true,"_trace":null},{"file":"ledgerly/reports.py","line":72,"category":"robustness","severity":"major","title":"Division by zero when budget limit is 0","description":"If a budget row has `limit_cents == 0`, computing `spent // b[\"limit_cents\"]` raises ZeroDivisionError, crashing the report instead of handling the edge case (e.g. treating any spend as immediately over budget).","_true":true,"_trace":null},{"file":"ledgerly/reports.py","line":62,"category":"test-adequacy","severity":"major","title":"No tests for budget_alerts","description":"The PR adds a new public function `budget_alerts` with threshold logic, percentage math, and a configurable parameter, but no tests are included to verify correct behavior, the default threshold, custom thresholds, or edge cases like zero-limit budgets or spend exactly at the threshold.","_true":false,"_trace":null}],"rejected":[],"stages":[],"seconds":10.6,"cost_usd":0.0209528,"raw":null,"found":2,"missed":[],"false_positives":1},"agent-v5":{"findings":[{"file":"ledgerly/reports.py","line":73,"category":"correctness","severity":"critical","title":"Integer division computes wrong percentage, alert never fires below 100% of budget","description":"`pct = spent // b[\"limit_cents\"] * 100` performs integer division before multiplying by 100, instead of `spent * 100 // b[\"limit_cents\"]`. For any spend strictly less than the limit (e.g. spent=9000 cents, limit=10000 cents, i.e. 90% spent), `spent // limit_cents` truncates to 0, so `pct` is 0 regardless of the actual percentage. This means the function never flags a category until spend equals or exceeds the full limit (100%+), completely defeating the PR's stated purpose of warning users at 80% before they go over budget. Additionally, once spend exceeds the limit, the reported `percent` value is wrong/coarse: e.g. spent=25000, limit=10000 gives `25000 // 10000 * 100 = 200`, which happens to be correct here, but spent=19999, limit=10000 gives `1 * 100 = 100` even though actual spend is 199.99% \u03b2\u20ac\u201d the percent shown to the UI is misleading and inconsistent with the real ratio.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/reports.py:73, confirming `pct = spent // b[\"limit_cents\"] * 100`. Reproduced numerically: spent=9000/limit=10000 (90%) yields pct=0; spent=19999/limit=10000 (199.99%) yields pct=100. Also ran budget_alerts() end-to-end with a fake db where spend is 90% of the limit (9000/10000 cents) and it returned an empty list instead of an alert, proving the described defeat of the PR's 80% threshold purpose. This is a genuine logic bug in new production code, not a test-coverage nitpick, so it passes the policy gate as a real defect.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"python3 -c \"\nspent=9000\nlimit=10000\npct = spent // limit * 100\nprint(pct)\nspent=25000\nlimit=10000\npct = spent // limit * 100\nprint(pct)\nspent=19999\nlimit=10000\npct = spent // limit * 100\nprint(pct)\n\"\n"},{"k":"out","text":"0\n200\n100"},{"k":"say","text":"All computations match the reviewer's claim exactly: 90% spend \u2192 pct=0, 250% spend \u2192 pct=200 (coincidentally correct), 199.99% spend \u2192 pct=100 (wrong). This confirms the bug is real and would prevent the alert from firing until spend reaches/exceeds 100%, defeating the stated 80% threshold purpose."},{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpe0e6xaz3/repo/ledgerly/reports.py"},{"k":"out","text":"1\t\"\"\"Monthly summaries and budget tracking.\"\"\"\n2\t\n3\tfrom .utils import format_money\n4\t\n5\tALERT_THRESHOLD_PCT = 80\n6\t\n7\t\n8\tclass BudgetError(Exception):\n9\t    pass\n10\t\n11\t\n12\tdef set_budget(db, user_id, category, month, limit_cents):\n13\t    if limit_cents <= 0:\n14\t        raise BudgetError(\"budget limit must be positive\")\n15\t    db.execute(\n16\t        \"INSERT INTO budgets (user_id, category, month, limit_cents)\"\n17\t        \" VALUES (?, ?, ?, ?)\"\n18\t        \" ON CONFLICT (user_id, category, month)\"\n19\t        \" DO UPDATE SET limit_cents = excluded.limit_cents\",\n20\t        (user_id, category, month, limit_cents),\n21\t    )\n22\t\n23\t\n24\tdef monthly_summary(db, user_id, month):\n25\t    \"\"\"Total spend\n\u2026 (+2112 chars)"},{"k":"say","text":"Code confirms line 73 exactly as described. This is a genuine correctness bug directly defeating the PR's stated purpose (80% threshold alert), not a test-coverage nitpick \u2014 it's broken production code logic."},{"k":"tool","name":"Bash","arg":"python3 -c \"\nimport sys\nsys.path.insert(0,'.')\nfrom ledgerly.reports import budget_alerts\n\nclass FakeDB:\n    def __init__(self, expenses, budgets):\n        self.expenses = expenses\n        self.budgets = budgets\n    def query(self, sql, params):\n        if 'FROM expenses' in sql:\n            return \n\u2026 (+209 chars)"},{"k":"out","text":"[]"},{"k":"say","text":"Confirmed end-to-end: with spend at 90% of budget (9000/10000 cents), `budget_alerts` returns an empty list instead of flagging the category, proving the alert never fires below 100% as claimed."},{"k":"tool","name":"Bash","arg":"true"},{"k":"out","text":"(Bash completed with no output)"},{"k":"say","text":"{\"verdict\": \"CONFIRMED\", \"confidence\": \"high\", \"evidence\": \"Read ledgerly/reports.py:73, confirming `pct = spent // b[\\\"limit_cents\\\"] * 100`. Reproduced numerically: spent=9000/limit=10000 (90%) yields pct=0; spent=19999/limit=10000 (199.99%) yields pct=100. Also ran budget_alerts() end-to-end with a fake db where spend is 90% of the limit (9000/10000 cents) and it returned an empty list instead of an alert, proving the described defeat of the PR's 80% threshold purpose. This is a genuine logic bug in new production code, not a test-coverage nitpick, so it passes the policy gate as a real defect.\", \"adjusted_severity\": \"critical\"}"},{"k":"done","turns":5,"cost":0.051303,"secs":23.0}]}],"rejected":[],"stages":[{"stage":"reviewer_correctness","findings":2,"seconds":28.8,"cost_usd":0.059181399999999995},{"stage":"reviewer_security","findings":0,"seconds":12.2,"cost_usd":0.0392946},{"stage":"reviewer_tests","findings":0,"seconds":26.5,"cost_usd":0.0648706},{"stage":"verifier","in":1,"confirmed":1,"seconds":23.8}],"seconds":52.6,"cost_usd":0.2146,"raw":2,"found":1,"missed":["c06-d2"],"false_positives":0}}},"case07_password_reset":{"meta":{"title":"Password reset codes","tier":1,"clean":false,"pr_description":"Adds a two-step password reset flow: request_password_reset() issues a 6-digit code (delivery handled by the caller, e.g. email), and reset_password() sets a new password when the code matches.","defects":[{"id":"c07-d1","file":"ledgerly/auth.py","line":87,"severity":"major","category":"security","description":"Reset codes are generated with the non-cryptographic random module, whose Mersenne Twister output is predictable. Must use the secrets module like the rest of this file."},{"id":"c07-d2","file":"ledgerly/auth.py","line":88,"severity":"major","category":"security","description":"Codes are stored in a process-global dict with no expiry, despite RESET_CODE_TTL_MINUTES being defined. A code stays valid forever (until used or process restart)."},{"id":"c07-d3","file":"ledgerly/auth.py","line":94,"severity":"major","category":"security","description":"A 6-digit code can be brute-forced in at most a million attempts and nothing limits attempts or invalidates the code after failures; the comparison is also not constant-time."},{"id":"c07-d4","file":"ledgerly/auth.py","line":103,"severity":"major","category":"security","description":"After a successful password reset, existing session tokens are not revoked. If the account was compromised (the very scenario resets exist for), the attacker's session keeps working after the victim resets. Added during label adjudication: found by a system under evaluation, confirmed genuine."},{"id":"c07-d5","file":"ledgerly/auth.py","line":19,"severity":"minor","category":"robustness","description":"Reset codes live only in process memory: any restart or deploy invalidates outstanding codes, and multiple workers (each with their own dict) make the flow fail randomly behind a load balancer. Added during label adjudication."}]},"diff":"--- a/ledgerly/auth.py\n+++ b/ledgerly/auth.py\n@@ -6,6 +6,7 @@\n \n import hashlib\n import hmac\n+import random\n import secrets\n from datetime import datetime, timedelta, timezone\n \n@@ -13,6 +14,9 @@\n \n PBKDF2_ITERATIONS = 200_000\n TOKEN_TTL_HOURS = 24\n+RESET_CODE_TTL_MINUTES = 15\n+\n+_reset_codes = {}\n \n \n class AuthError(Exception):\n@@ -74,3 +78,26 @@\n         db.execute(\"DELETE FROM tokens WHERE token = ?\", (token,))\n         raise AuthError(\"token expired\")\n     return row[\"user_id\"]\n+\n+def request_password_reset(db, username):\n+    \"\"\"Issue a 6-digit reset code for the user. Caller delivers it (email).\"\"\"\n+    row = db.query_one(\"SELECT id FROM users WHERE username = ?\", (username,))\n+    if row is None:\n+        raise AuthError(\"unknown user\")\n+    code = str(random.randint(100000, 999999))\n+    _reset_codes[username] = code\n+    return code\n+\n+\n+def reset_password(db, username, code, new_password):\n+    \"\"\"Set a new password if the reset code matches.\"\"\"\n+    if _reset_codes.get(username) != code:\n+        raise AuthError(\"invalid reset code\")\n+    if len(new_password) < 8:\n+        raise AuthError(\"password must be at least 8 characters\")\n+    salt = secrets.token_hex(16)\n+    db.execute(\n+        \"UPDATE users SET password_hash = ?, salt = ? WHERE username = ?\",\n+        (_hash_password(new_password, salt), salt, username),\n+    )\n+    del _reset_codes[username]\n","systems":{"baseline":{"findings":[{"file":"ledgerly/auth.py","line":87,"category":"security","severity":"critical","title":"Reset code generated with non-cryptographic PRNG","description":"random.randint() uses the `random` module's Mersenne Twister, which is not cryptographically secure and is predictable given enough output. Password reset codes are a security-sensitive secret and must be generated with `secrets` (e.g. secrets.randbelow) to prevent an attacker from predicting or brute-forcing the sequence.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":88,"category":"correctness","severity":"major","title":"RESET_CODE_TTL_MINUTES defined but never enforced","description":"The constant RESET_CODE_TTL_MINUTES is declared but no timestamp is stored alongside the code and reset_password() never checks expiry. Reset codes therefore never expire, letting an old/leaked code be used indefinitely.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":94,"category":"security","severity":"critical","title":"No rate limiting or attempt throttling on reset_password","description":"reset_password() allows unlimited attempts to guess a 6-digit code (1,000,000 possibilities) with no lockout, delay, or attempt counter, making online brute-force of the code trivial, especially combined with the fact the code never expires.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":86,"category":"security","severity":"minor","title":"User enumeration via distinct error on unknown username","description":"request_password_reset() raises AuthError('unknown user') when the username doesn't exist, letting an attacker distinguish valid from invalid usernames. It should behave identically (e.g. return without error) regardless of whether the account exists.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":94,"category":"security","severity":"minor","title":"Non-constant-time comparison of reset code","description":"`_reset_codes.get(username) != code` uses standard string comparison, which short-circuits on the first mismatched character, enabling a timing side-channel to help an attacker guess the code faster. Use hmac.compare_digest for the comparison.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":19,"category":"robustness","severity":"major","title":"Reset codes stored only in an in-process dict","description":"_reset_codes is a plain module-level dict, not persisted to the database. It will not be shared across multiple worker processes/threads (common in production deployments) and is wiped on any restart, breaking the reset flow and silently losing pending reset requests.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":103,"category":"security","severity":"major","title":"Existing sessions/tokens not invalidated after password reset","description":"After a successful password reset, any outstanding auth tokens for the user remain valid (the tokens table is untouched). If the password was reset because of a compromised account, an attacker holding a valid token retains access after the reset.","_true":true,"_trace":null},{"file":"ledgerly/auth.py","line":82,"category":"test-adequacy","severity":"major","title":"No tests for new password reset functionality","description":"The diff adds request_password_reset() and reset_password(), including new expiry/security-relevant behavior, but includes no test coverage for the happy path, invalid code, expired code, or unknown user cases.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":35.2,"cost_usd":0.0493858,"raw":null,"found":5,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/auth.py","line":87,"category":"security","title":"Reset code generated with non-cryptographic RNG","severity":"critical","description":"request_password_reset() uses random.randint(100000, 999999) (Mersenne Twister, not cryptographically secure) to generate the reset code, while the rest of the module (secrets.token_hex, secrets.token_urlsafe) correctly uses the `secrets` module. random's internal state can be recovered from a handful of outputs and its output is predictable, letting an attacker who observes other random-derived values (or brute-forces the 32-bit MT19937 state via other leaked outputs) predict or narrow down reset codes for arbitrary usernames, enabling account takeover without ever receiving the emailed code.","reviewer":"security","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/auth.py lines 82-89: request_password_reset() generates the 6-digit reset code via `random.randint(100000, 999999)` (stdlib `random`, backed by MT19937), while every other credential in the same module (session tokens, salts) uses `secrets.token_hex`/`secrets.token_urlsafe`. Grepped the package and confirmed this is the only use of `random.` anywhere in ledgerly/. Verified via `python3 -c` that `random`'s internal generator state is fully deterministic/observable (getstate() exposes the MT19937 state vector), consistent with the well-documented fact that MT19937 outputs are predictable/invertible given enough samples \u2014 it is not appropriate for security-sensitive tokens. The reset code is a genuine authentication credential (used later in reset_password() to authorize a password change), so using a non-CSPRNG here is a real code defect, not a test-coverage nit.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpbl2f4pee/repo/ledgerly/auth.py"},{"k":"out","text":"1\t\"\"\"User accounts and token authentication.\n2\t\n3\tPasswords are salted and hashed with PBKDF2. Session tokens are random,\n4\tstored server-side with an expiry, and compared in constant time.\n5\t\"\"\"\n6\t\n7\timport hashlib\n8\timport hmac\n9\timport random\n10\timport secrets\n11\tfrom datetime import datetime, timedelta, timezone\n12\t\n13\tfrom .utils import utcnow_iso\n14\t\n15\tPBKDF2_ITERATIONS = 200_000\n16\tTOKEN_TTL_HOURS = 24\n17\tRESET_CODE_TTL_MINUTES = 15\n18\t\n19\t_reset_codes = {}\n20\t\n21\t\n22\tclass AuthError(Exception):\n23\t    pass\n24\t\n25\t\n26\tdef _hash_password(password, salt):\n27\t    dk = hashlib.pbkdf2_hmac(\n28\t        \"sha256\", password.encode(), bytes.fromhex(salt), PBKDF2_ITERATIONS\n29\t    )\n30\t    retu\n\u2026 (+2944 chars)"},{"k":"say","text":"The claim is accurate: line 87 uses `random.randint` (Mersenne Twister, not CSPRNG) for the 6-digit reset code, while `login`/`register` use `secrets`. This is a genuine security defect \u2014 reset codes are a security-sensitive credential (equivalent to a short-lived password), and using a non-cryptographic PRNG for them is a real weakness (predictability if MT19937 state is inferred from other `random` outputs elsewhere in the process, and a 6-digit code space is also weak generally, but the specific defect is the RNG choice, not test coverage). This isn't an \"absence of test\" complaint \u2014 it's a defect in the actual code that generates a security credential."},{"k":"tool","name":"Bash","arg":"grep -rn \"random\\.\" /Users 2>/dev/null; grep -rn \"import random\\|random\\.\" ledgerly/ 2>/dev/null"},{"k":"out","text":"Command did not complete within its 120s timeout and was moved to the background (ID: b03ajo8q4). Output is being written to: /private/tmp/claude-502/-private-var-folders-16-68bllkdn5n75d9gn5qj1thtw0000gp-T-tmpbl2f4pee-repo/a905d14b-e5a4-4499-98c8-10c9d7eda003/tasks/b03ajo8q4.output. You will be notified when it completes. To check interim output, use Read on that file path."},{"k":"tool","name":"Grep","arg":"random\\."},{"k":"out","text":"ledgerly/auth.py:87:    code = str(random.randint(100000, 999999))"},{"k":"say","text":"Confirmed: `random.randint` is used only here, standing in stark contrast to `secrets` used everywhere else in the same module for other security tokens. This is a real, concrete defect in shipped code (not a test-coverage nit), directly enabling weaker-than-intended reset-code security."},{"k":"tool","name":"Bash","arg":"python3 -c \"\nimport random\nrandom.seed(0)\nprint(random.randint(100000,999999))\nprint(random.getstate()[1][:5])\n\""},{ s technically accurate and represents a real deviation from the codebase's established secure-comparison pattern.","adjusted_severity":"minor"},"_true":true,"_trace":[{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpjm3qll3e/repo/ledgerly/auth.py"},{"k":"out","text":"1\t\"\"\"User accounts and token authentication.\n2\t\n3\tPasswords are salted and hashed with PBKDF2. Session tokens are random,\n4\tstored server-side with an expiry, and compared in constant time.\n5\t\"\"\"\n6\t\n7\timport hashlib\n8\timport hmac\n9\timport random\n10\timport secrets\n11\tfrom datetime import datetime, timedelta, timezone\n12\t\n13\tfrom .utils import utcnow_iso\n14\t\n15\tPBKDF2_ITERATIONS = 200_000\n16\tTOKEN_TTL_HOURS = 24\n17\tRESET_CODE_TTL_MINUTES = 15\n18\t\n19\t_reset_codes = {}\n20\t\n21\t\n22\tclass AuthError(Exception):\n23\t    pass\n24\t\n25\t\n26\tdef _hash_password(password, salt):\n27\t    dk = hashlib.pbkdf2_hmac(\n28\t        \"sha256\", password.encode(), bytes.fromhex(salt), PBKDF2_ITERATIONS\n29\t    )\n30\t    retu\n\u2026 (+2944 chars)"},{"k":"tool","name":"Grep","arg":"compare_digest|reset_code|attempt|rate.limit"},{"k":"out","text":"ledgerly/auth.py:19:_reset_codes = {}\nledgerly/auth.py:58:    if not hmac.compare_digest(expected, actual):\nledgerly/auth.py:88:    _reset_codes[username] = code\nledgerly/auth.py:94:    if _reset_codes.get(username) != code:\nledgerly/auth.py:103:    del _reset_codes[username]"},{"k":"say","text":"Confirmed by direct code reading: `login()` at line 58 uses `hmac.compare_digest`, while `reset_password()` at line 94 uses a plain `!=` string comparison for the secret reset code, with no rate-limiting or other mitigation anywhere in the file. The claim accurately describes the code and is a genuine inconsistency in the codebase's own security practice (not a test-coverage complaint), so it passes both truth and policy gates."},{"k":"tool","name":"Bash","arg":"python3 -c \"\na='123456'\nb ops any failing row and hides the reason. The caller gets only a count, with no way to know which rows were rejected or why; even programming errors (KeyError from a malformed dict) vanish."},{"id":"c08-d2","file":"ledgerly/expenses.py","line":75,"severity":"critical","category":"correctness","description":"Rows come from parsed CSV/JSON uploads, so amount_cents is typically a string like '12.50'. It is passed straight to add_expense and SQLite stores the TEXT value, silently corrupting later SUM aggregations. The importer must validate/convert amounts (e.g. via parse_money)."}]},"diff":"--- a/ledgerly/expenses.py\n+++ b/ledgerly/expenses.py\n@@ -59,3 +59,25 @@\n     sql += \" ORDER BY spent_on DESC, id DESC LIMIT ? OFFSET ?\"\n     params += [PAGE_SIZE, (page - 1) * PAGE_SIZE]\n     return [dict(r) for r in db.query(sql, tuple(params))]\n+\n+def import_expenses(db, user_id, rows):\n+    \"\"\"Import expense rows parsed from a CSV/JSON upload.\n+\n+    Each row is a dict with amount_cents, category, spent_on and an\n+    optional note. Invalid rows are skipped. Returns the number imported.\n+    \"\"\"\n+    count = 0\n+    for row in rows:\n+        try:\n+            add_expense(\n+                db,\n+                user_id,\n+                row[\"amount_cents\"],\n+                row[\"category\"],\n+                row[\"spent_on\"],\n+                row.get(\"note\", \"\"),\n+            )\n+            count += 1\n+        except Exception:\n+            pass\n+    return count\n","systems":{"baseline":{"findings":[{"file":"ledgerly/expenses.py","line":81,"category":"robustness","title":"Overly broad exception handling masks real failures","description":"The bare `except Exception: pass` catches every possible error, not just validation failures (e.g. bad amount_cents type, missing category). It will also silently swallow database errors (locked DB, disk I/O errors, programming errors like TypeError from a bug elsewhere), making it impossible to distinguish 'row was invalid' from 'the import subsystem is broken'. This also makes debugging production issues very difficult since failures leave no trace.","severity":"major","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":83,"category":"robustness","title":"No visibility into which rows failed or why","description":"import_expenses only returns a count of successfully imported rows. Callers/users have no way to know which specific rows were skipped or why, so users uploading a CSV/JSON with a few bad rows cannot fix their data. For a bulk-import feature this is a significant usability/robustness gap.","severity":"major","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":70,"category":"security","title":"No limit on number of rows processed","description":"The function iterates over `rows` with no cap on size. A large uploaded CSV/JSON (e.g. millions of rows) will be processed synchronously with no batching, timeout, or size limit, allowing a single request to consume excessive CPU/DB time \u2014 a potential resource-exhaustion (DoS) vector for an upload-driven endpoint.","severity":"major","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":69,"category":"robustness","title":"No transactional grouping for the batch import","description":"Each row is presumably committed individually via add_expense with no surrounding transaction. If the process is interrupted partway (crash, exception, timeout) there is no way to roll back or resume the batch, and partial imports can leave the user's data half-migrated with no indication of where it stopped.","severity":"minor","_true":true,"_trace":null},{"file":"ledgerly/expenses.py","line":63,"category":"test-adequacy","title":"No tests added for import_expenses","description":"The diff adds a new public function with several edge cases (missing keys, wrong types, empty rows list, all rows invalid, mix of valid/invalid rows) but includes no accompanying unit tests, so none of this behavior is verified.","severity":"major","_true":false,"_trace":null}],"rejected":[],"stages":[],"seconds":38.8,"cost_usd":0.0483398,"raw":null,"found":2,"missed":[],"false_positives":1},"agent-v5":{"findings":[{"file":"ledgerly/expenses.py","line":75,"category":"correctness","title":"amount_cents from CSV/JSON rows is passed through unvalidated and unconverted, corrupting stored amounts","severity":"critical","description":"import_expenses() forwards row[\"amount_cents\"] straight to add_expense() without going through parse_money() or any numeric/sign validation, even though the docstring says rows are 'parsed from CSV/JSON uploads' (i.e. raw strings) and other apps' exports would represent amounts as dollar strings like \"12.50\", not internal integer cents. Since the expenses.amount_cents column has SQLite INTEGER affinity, a string such as \"12.50\" is silently coerced to REAL 12.5 on insert (representing 12.5 cents = $0.125 instead of the intended $12.50), corrupting the stored value by two orders of magnitude with no error raised. A non-numeric string is stored as raw TEXT, which reports.monthly_summary()'s SUM(amount_cents) at ledgerly/reports.py:25 silently treats as 0, producing wrong totals with no indication anything went wrong. Additionally, add_expense() (ledgerly/expenses.py:18-28) performs no positivity check on amount_cents (unlike parse_money, which explicitly rejects <=0), so negative or zero amounts from a row are accepted as 'imported' even though they are semantically invalid, contradicting the PR's claim that invalid rows are skipped.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/expenses.py, reports.py, utils.py, db.py to confirm add_expense() passes amount_cents straight into a parameterized INSERT with no call to parse_money and no sign check, and the expenses.amount_cents column has INTEGER affinity. Executed a reproduction: import_expenses with rows amount_cents='12.50' (string), 'garbage' (string), -500, and 0. Result: all 4 rows reported as successfully imported (count=4); row 1 stored as amount_cents=12.5 (REAL, i.e. $0.125 instead of $12.50 \u2014 corrupted by 100x exactly as claimed); row 2 stored as raw TEXT 'garbage'; row 3 and 4 stored as -500 and 0 with no rejection. reports.monthly_summary() then summed these via SQL SUM(amount_cents) and returned food: -487.5 (12.5 + 0 + -500 + 0), silently wrong with no error. Confirmed no test file covers import_expenses and the function is otherwise unused, but the finding is about defective behavior of new code shipped in this PR, not a missing-test complaint, so it passes the policy gate as a real correctness defect.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpkxfw7txz/repo/ledgerly/expenses.py"},{"k":"out","text":"1\t\"\"\"Expense CRUD and listing. Every operation is scoped to the owning user.\"\"\"\n2\t\n3\tfrom .utils import parse_iso_date, utcnow_iso\n4\t\n5\tVALID_CATEGORIES = {\n6\t    \"food\", \"transport\", \"housing\", \"utilities\",\n7\t    \"health\", \"entertainment\", \"other\",\n8\t}\n9\t\n10\tMAX_NOTE_LEN = 500\n11\tPAGE_SIZE = 20\n12\t\n13\t\n14\tclass ExpenseError(Exception):\n15\t    pass\n16\t\n17\t\n18\tdef add_expense(db, user_id, amount_cents, category, spent_on, note=\"\"):\n19\t    if category not in VALID_CATEGORIES:\n20\t        raise ExpenseError(f\"unknown category: {category}\")\n21\t    if len(note) > MAX_NOTE_LEN:\n22\t        raise ExpenseError(\"note too long\")\n23\t    d = parse_iso_date(spent_on)\n24\t    return db.execute(\n25\t        \"I\n\u2026 (+2016 chars)"},{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpkxfw7txz/repo/ledgerly/reports.py"},{"k":"out","text":"1\t\"\"\"Monthly summaries and budget tracking.\"\"\"\n2\t\n3\tfrom .utils import format_money\n4\t\n5\t\n6\tclass BudgetError(Exception):\n7\t
