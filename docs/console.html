","text":"{\"verdict\": \"CONFIRMED\", \"confidence\": \"high\", \"evidence\": \"Read ledgerly/reports.py:59-71: sort key is `lambda kv: format_money(kv[1])` \u2014 only the formatted amount, never the category name (kv[0]), so ties cannot be broken alphabetically. Reproduced with an in-memory DB: inserted three categories ('Zoo', 'Mango', 'Apple') each totaling $50.00, inserted in that non-alphabetical order. `top_categories()` returned them as [Zoo, Mango, Apple] \u2014 pure insertion/SQL order, not alphabetical ([Apple, Mango, Zoo] as docstring/PR claim). No test in tests/test_ledgerly.py covers top_categories or this tie-break claim, so nothing masks the bug. This directly contradicts the explicit docstring promise 'Ties are broken alphabetically' and the PR description's identical claim \u2014 a genuine functional gap between documented/promised behavior and actual code, not a missing-test complaint.\", \"adjusted_sever\n\u2026 (+14 chars)"},{"k":"done","turns":7,"cost":0.07752419999999999,"secs":34.1}]}],"rejected":[],"stages":[{"stage":"reviewer_correctness","findings":2,"seconds":39.6,"cost_usd":0.0683816},{"stage":"reviewer_security","findings":0,"seconds":16.5,"cost_usd":0.037617399999999995},{"stage":"reviewer_tests","findings":0,"seconds":21.2,"cost_usd":0.0491474},{"stage":"verifier","in":2,"confirmed":2,"seconds":38.0}],"seconds":77.6,"cost_usd":0.2922,"raw":2,"found":2,"missed":[],"false_positives":0}}},"case17_api_export":{"meta":{"title":"CSV export endpoint + household API","tier":3,"clean":false,"pr_description":"Adds GET /export (download expenses as CSV), and first household endpoints: GET /household/balances and POST /household/expenses. Also tidies the handler layer: field validation renamed to _require_fields and route registrations grouped by resource.","defects":[{"id":"c17-d1","file":"ledgerly/api.py","line":200,"severity":"major","category":"correctness","description":"CSV rows are built by joining raw values with commas and no quoting/escaping. Any note containing a comma, quote or newline (notes are free text up to 500 chars) shifts columns and corrupts the export. Must use the csv module."},{"id":"c17-d2","file":"ledgerly/api.py","line":162,"severity":"critical","category":"security","description":"GET /household/balances never verifies the requester belongs to the household (household.require_member exists for exactly this, and POST /household/expenses inherits the check via add_shared_expense's paid_by). Any authenticated user can enumerate household_id values and read other households' member balances."},{"id":"c17-d3","file":"ledgerly/api.py","line":176,"severity":"major","category":"correctness","description":"POST /household/expenses converts the amount via float, losing cents ('19.99' -> 1998) and accepting junk like '1e3' or negatives, while POST /expenses five routes up uses parse_money. Inconsistent and wrong for money."},{"id":"c17-d4","file":"tests/test_api.py","line":87,"severity":"major","category":"test-adequacy","description":"test_balances_for_own_household implies household scoping is verified but never exercises a non-member request, hiding the missing require_member check in the endpoint. Promoted in adjudication round 2: flagged independently by two systems."}]},"diff":"--- a/ledgerly/api.py\n+++ b/ledgerly/api.py\n@@ -5,10 +5,13 @@\n HTTP server; tests call handle() directly. Authentication is a bearer\n token resolved by the auth middleware; handlers marked @route(...,\n auth=True) receive the resolved user id.\n+\n+Routes are grouped by resource: auth, expenses, reports, household,\n+export.\n \"\"\"\n \n from . import auth, expenses, household, reports\n-from .utils import parse_money\n+from .utils import format_money, parse_money\n \n _ROUTES = {}\n \n@@ -67,15 +70,17 @@\n         return 401, {\"error\": str(e)}\n \n \n-def _require(body, *fields):\n+def _require_fields(body, *fields):\n     missing = [f for f in fields if f not in body]\n     if missing:\n         raise ApiError(400, f\"missing fields: {', '.join(missing)}\")\n \n \n+# --- auth ---------------------------------------------------------------\n+\n @route(\"POST\", \"/register\", auth_required=False)\n def post_register(db, request):\n-    _require(request.body, \"username\", \"password\")\n+    _require_fields(request.body, \"username\", \"password\")\n     user_id = auth.register(db, request.body[\"username\"],\n                             request.body[\"password\"])\n     return 201, {\"user_id\": user_id}\n@@ -83,14 +88,16 @@\n \n @route(\"POST\", \"/login\", auth_required=False)\n def post_login(db, request):\n-    _require(request.body, \"username\", \"password\")\n+    _require_fields(request.body, \"username\", \"password\")\n     token = auth.login(db, request.body[\"username\"], request.body[\"password\"])\n     return 200, {\"token\": token}\n \n \n+# --- expenses -----------------------------------------------------------\n+\n @route(\"POST\", \"/expenses\")\n def post_expense(db, request):\n-    _require(request.body, \"amount\", \"category\", \"spent_on\")\n+    _require_fields(request.body, \"amount\", \"category\", \"spent_on\")\n     cents = parse_money(str(request.body[\"amount\"]))\n     eid = expenses.add_expense(\n         db, request.user_id, cents, request.body[\"category\"],\n@@ -110,11 +117,13 @@\n \n @route(\"DELETE\", \"/expenses\")\n def delete_expense(db, request):\n-    _require(request.body, \"expense_id\")\n+    _require_fields(request.body, \"expense_id\")\n     expenses.delete_expense(db, request.user_id,\n                             int(request.body[\"expense_id\"]))\n     return 200, {\"deleted\": True}\n \n+\n+# --- reports ------------------------------------------------------------\n \n @route(\"GET\", \"/summary\")\n def get_summary(db, request):\n@@ -134,9 +143,60 @@\n \n @route(\"POST\", \"/budgets\")\n def post_budget(db, request):\n-    _require(request.body, \"category\", \"month\", \"limit\")\n+    _require_fields(request.body, \"category\", \"month\", \"limit\")\n     reports.set_budget(\n         db, request.user_id, request.body[\"category\"], request.body[\"month\"],\n         parse_money(str(request.body[\"limit\"])),\n     )\n     return 201, {\"ok\": True}\n+\n+\n+# --- household ----------------------------------------------------------\n+\n+@route(\"GET\", \"/household/balances\")\n+def get_household_balances(db, request):\n+    hid = request.params.get(\"household_id\")\n+    if not hid:\n+        raise ApiError(400, \"household_id parameter required\")\n+    hid = int(hid)\n+    net = household.balances(db, hid)\n+    return 200, {\n+        \"balances\": [\n+            {\"user_id\": uid, \"net_cents\": cents,\n+             \"net\": format_money(cents)}\n+            for uid, cents in sorted(net.items())\n+        ]\n+    }\n+\n+\n+@route(\"POST\", \"/household/expenses\")\n+def post_household_expense(db, request):\n+    _require_fields(request.body, \"household_id\", \"amount\", \"category\",\n+                    \"spent_on\")\n+    cents = int(float(request.body[\"amount\"]) * 100)\n+    eid = household.add_shared_expense(\n+        db, int(request.body[\"household_id\"]), request.user_id, cents,\n+        request.body[\"category\"], request.body[\"spent_on\"],\n+        request.body.get(\"note\", \"\"),\n+    )\n+    return 201, {\"shared_expense_id\": eid}\n+\n+\n+# --- export -------------------------------------------------------------\n+\n+@route(\"GET\", \"/export\")\n+def get_export(db, request):\n+    \"\"\"Download the user's expenses as CSV text (newest first).\"\"\"\n+    category = request.params.get(\"category\")\n+    lines = [\"spent_on,category,amount,note\"]\n+    page = 1\n+    while True:\n+        rows = expenses.list_expenses(db, request.user_id,\n+                                      category=category, page=page)\n+        if not rows:\n+            break\n+        for r in rows:\n+            amount = f\"{r['amount_cents'] / 100:.2f}\"\n+            lines.append(f\"{r['spent_on']},{r['category']},{amount},{r['note']}\")\n+        page += 1\n+    return 200, {\"content_type\": \"text/csv\", \"body\": \"\\n\".join(lines)}\n\n--- a/tests/test_api.py\n+++ b/tests/test_api.py\n@@ -82,3 +82,32 @@\n         status, body = api.handle(db, authed(\n             \"GET\", \"/budgets\", token, params={\"month\": \"2026-03\"}))\n         assert status == 200 and body[\"budgets\"][0][\"over_budget\"] is False\n+\n+class TestHouseholdEndpoints:\n+    def test_balances_for_own_household(self, db, user, bob, token):\n+        from ledgerly import household\n+        hid = household.create_household(db, user, \"Flat\")\n+        household.add_member(db, hid, user, bob)\n+        status, body = api.handle(db, authed(\n+            \"POST\", \"/household/expenses\", token,\n+            body={\"household_id\": hid, \"amount\": \"10.00\",\n+                  \"category\": \"food\", \"spent_on\": \"2026-03-01\"}))\n+        assert status == 201\n+        status, body = api.handle(db, authed(\n+            \"GET\", \"/household/balances\", token,\n+            params={\"household_id\": str(hid)}))\n+        assert status == 200\n+        net = {b[\"user_id\"]: b[\"net_cents\"] for b in body[\"balances\"]}\n+        assert net[user] == 500 and net[bob] == -500\n+\n+\n+class TestExport:\n+    def test_export_csv(self, db, token):\n+        api.handle(db, authed(\n+            \"POST\", \"/expenses\", token,\n+            body={\"amount\": \"12.50\", \"category\": \"food\",\n+                  \"spent_on\": \"2026-03-01\", \"note\": \"lunch\"}))\n+        status, body = api.handle(db, authed(\"GET\", \"/export\", token))\n+        assert status == 200\n+        assert body[\"body\"].splitlines()[0] == \"spent_on,category,amount,note\"\n+        assert \"2026-03-01,food,12.50,lunch\" in body[\"body\"]\n","systems":{"baseline":{"findings":[{"file":"ledgerly/api.py","line":160,"category":"security","severity":"critical","title":"No membership check on household balances endpoint","description":"get_household_balances takes household_id from the request and calls household.balances(db, hid) without verifying that request.user_id is actually a member of that household. Any authenticated user can view any other household's balances simply by guessing/incrementing household_id, leaking other users' financial data (IDOR).","_true":true,"_trace":null},{"file":"ledgerly/api.py","line":175,"category":"security","severity":"critical","title":"No membership check on shared expense creation","description":"post_household_expense accepts an arbitrary household_id and calls household.add_shared_expense without verifying request.user_id belongs to that household. Any authenticated user can inject expenses into a household they are not a member of, corrupting other households' balances (IDOR / broken access control).","_true":true,"_trace":null},{"file":"ledgerly/api.py","line":174,"category":"correctness","severity":"major","title":"Household expense amount parsed with float instead of parse_money","description":"Unlike every other money-handling handler (post_expense, post_budget), this uses `int(float(request.body[\"amount\"]) * 100)` instead of `parse_money(str(...))`. Float multiplication is not exact for many decimal values (e.g. 19.99 * 100 == 1998.9999999999998), so `int()` truncation can silently store the wrong amount (off by a cent), and it also skips whatever input validation/rejection parse_money performs (e.g. malformed strings, negative amounts).","_true":true,"_trace":null},{"file":"ledgerly/api.py","line":198,"category":"security","severity":"major","title":"CSV export not escaped, vulnerable to injection and data corruption","description":"The CSV row is built with a raw f-string joining fields with commas, with no quoting/escaping of category or note. If a category or note contains a comma or newline the row will be misaligned/corrupted. If note begins with '=', '+', '-', or '@', the exported file can trigger CSV/formula injection when opened in Excel/Sheets, potentially executing attacker-controlled formulas against the user who downloads their own export (stored injection via categories/notes entered by another flow).","_true":true,"_trace":null},{"file":"ledgerly/api.py","line":159,"category":"robustness","severity":"minor","title":"Unvalidated household_id causes unhandled exception","description":"`hid = int(hid)` will raise an uncaught ValueError (resulting in a 500) if a non-numeric household_id query parameter is supplied, instead of returning a clean 400 ApiError like other handlers do for malformed input.","_true":true,"_trace":null},{"file":"ledgerly/api.py","line":176,"category":"robustness","severity":"minor","title":"Unvalidated household_id in POST body causes unhandled exception","description":"`int(request.body[\"household_id\"])` will raise an uncaught ValueError (500 error) if household_id is non-numeric; _require_fields only checks presence, not type, so malformed input is not converted into a proper 400 response.","_true":true,"_trace":null},{"file":"tests/test_api.py","line":92,"category":"test-adequacy","severity":"major","title":"No tests for cross-household access control or CSV special-character handling","description":"The new tests only cover the happy path where the requesting user is a member of the household they query/post to, and export content with plain values. There is no test asserting that a user cannot read balances or post expenses for a household they don't belong to (which would have caught the missing authorization checks), and no test for CSV export with commas/newlines/formula-leading characters in category or note (which would have caught the CSV injection/corruption issue).","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":56.8,"cost_usd":0.0813858,"raw":null,"found":4,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/api.py","line":156,"category":"security","severity":"critical","title":"Missing authorization check on GET /household/balances (IDOR)","description":"get_household_balances takes household_id from the query params and calls household.balances(db, hid) directly, without verifying that request.user_id is a member of that household (unlike post_household_expense, which internally hits household.require_member via add_shared_expense, and unlike expenses.list_expenses which scopes by user_id). Any authenticated user can enumerate arbitrary household_id values and read the net balances (user_id -> cents owed) of households they do not belong to, leaking other users' financial data. Fix by calling household.require_member(db, hid, request.user_id) before computing balances.","reviewer":"security","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/household.py: balances(db, household_id) (line 111) has no membership check, only add_shared_expense calls require_member (line 87). Read ledgerly/api.py get_household_balances (diff lines ~156-169): it takes household_id straight from query params and calls household.balances(db, hid) with no require_member call and no comparison to request.user_id. Wrote and ran a live exploit: registered alice/bob/carol, created a household with alice+bob only, added a shared expense, then logged in as carol (not a member) and called GET /household/balances?household_id=<hid> with her own valid token. Result: status 200 with full balance data {'user_id':1,'net_cents':500,...},{'user_id':2,'net_cents':-500,...} \u2014 carol successfully read alice and bob's private financial data despite not being a household member, confirming the IDOR is real and trivially exploitable by any authenticated user via household_id enumeration.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"find . -name \"household.py\" | head -5"},{"k":"out","text":"./ledgerly/household.py"},{"k":"tool","name":"Read","arg":"./ledgerly/household.py"},{ ile, which parses the decimal string directly and avoids float rounding.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/api.py:176 and confirmed post_household_expense computes `cents = int(float(request.body[\"amount\"]) * 100)` while sibling handlers post_expense/post_budget use parse_money (utils.py), which parses the decimal string directly without float conversion. Verified household.add_shared_expense stores amount_cents as-is with no re-parsing/validation that would fix truncation. Executed a full end-to-end repro through api.handle(POST /household/expenses, amount='19.99') and inspected the DB row directly: stored amount_cents == 1998 instead of the correct 1999 (parse_money('19.99') == 1999, confirmed separately). Also confirmed other amounts like '0.29' truncate to 28 cents. This is a real, reachable, silent data-corruption bug in monetary storage, not a test-coverage complaint.","adjusted_severity":"major"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"python3 -c \"\nprint(float('19.99')*100)\nprint(int(float('19.99')*100))\n\""},{"k":"tool","name":"Read","arg":"repo/ledgerly/api.py"},{"k":"out","text":"1998.9999999999998\n1998"},{"k":"out","text":"File does not exist. Note: your current working directory is /private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpgwl5zgl1/repo."},{"k":"tool","name":"Glob","arg":"**/api.py"},{"k":"tool","name":"Glob","arg":"**/utils.py"},{"k":"out","text":"ledgerly/utils.py"},{"k":"out","text":"ledgerly/api.py"},{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpgwl5zgl1/repo/ledgerly/api.py"},{"k":"out","text":"1\t\"\"\"HTTP-style API layer.\n2\t\n3\tA minimal, transport-agnostic router: handlers receive a Request and\n4\treturn (status, body_dict). A real deployment mounts handle() behind any\n5\tHTTP server; tests call handle() directly. Authentication is a bearer\n6\ttoken resolved by the auth middlewa fects":[{"id":"c18-d1","file":"ledgerly/importers.py","line":93,"severity":"critical","category":"correctness","description":"Deduplication now keys on (date, amount) only \u2014 the description was dropped from the check. Two different merchants charging the same amount on the same day (two $9.99 subscriptions) means the second is silently skipped as a 'duplicate'. Data loss relative to v1, which included the note."},{"id":"c18-d2","file":"ledgerly/importers.py","line":82,"severity":"major","category":"correctness","description":"The description is uppercased but the user-supplied mapping prefix is used as-given, so any mapping rule not written in ALL CAPS ('Coffee' -> food) never matches and the docstring's 'case-insensitive' promise is false. Both sides must be normalized."},{"id":"c18-d3","file":"ledgerly/importers.py","line":107,"severity":"major","category":"correctness","description":"The batch is wrapped in db.transaction(), but every add_expense call goes through db.execute, which runs its own transaction and COMMITs immediately (see db.py). A failure mid-batch still leaves earlier rows committed \u2014 the advertised all-or-nothing behavior does not exist."},{"id":"c18-d4","file":"tests/test_importers.py","line":69,"severity":"major","category":"test-adequacy","description":"The test named test_atomic_batch imports an all-valid statement and asserts success. It never includes a failing row, so it cannot detect that atomicity is broken \u2014 the one scenario it is named after."}]},"diff":"--- a/ledgerly/importers.py\n+++ b/ledgerly/importers.py\n@@ -3,15 +3,20 @@\n Supports simple CSV exports: a header row naming date, amount, and\n description columns (several common spellings accepted), then data rows.\n Amounts in statements are negative for spend; we import spend as positive\n-cents and skip credits. Each import records a batch row for auditing, and\n-duplicate rows (same date, amount, and description as an existing expense)\n-are skipped so re-importing an overlapping statement is safe.\n+cents and skip credits.\n+\n+v2 additions:\n+- category mapping: case-insensitive prefix rules applied to the\n+  description, e.g. {\"COFFEE\": \"food\", \"STREAM\": \"entertainment\"}.\n+- atomic batches: a statement imports all-or-nothing, so a malformed row\n+  no longer leaves a half-imported statement behind.\n+- faster duplicate detection keyed on (date, amount).\n \"\"\"\n \n import csv\n import io\n \n-from .expenses import add_expense\n+from .expenses import VALID_CATEGORIES, add_expense\n from .utils import parse_iso_date, parse_money, utcnow_iso\n \n DATE_HEADERS = {\"date\", \"posted\", \"transaction date\"}\n@@ -69,29 +74,47 @@\n     return rows\n \n \n-def _is_duplicate(db, user_id, spent_on, amount_cents, note):\n+def category_for(desc, category_map):\n+    \"\"\"Resolve a description to a category via case-insensitive prefix\n+    rules; falls back to DEFAULT_CATEGORY.\"\"\"\n+    if category_map:\n+        for prefix, category in category_map.items():\n+            if desc.upper().startswith(prefix):\n+                if category not in VALID_CATEGORIES:\n+                    raise ImportError_(f\"mapping targets unknown category:\"\n+                                       f\" {category}\")\n+                return category\n+    return DEFAULT_CATEGORY\n+\n+\n+def _is_duplicate(db, user_id, spent_on, amount_cents):\n     row = db.query_one(\n         \"SELECT id FROM expenses WHERE user_id = ? AND spent_on = ?\"\n-        \" AND amount_cents = ? AND note = ?\",\n-        (user_id, spent_on, amount_cents, note),\n+        \" AND amount_cents = ?\",\n+        (user_id, spent_on, amount_cents),\n     )\n     return row is not None\n \n \n-def import_statement(db, user_id, text, source=\"csv\",\n-                     category=DEFAULT_CATEGORY):\n-    \"\"\"Import a statement. Returns (imported, skipped_duplicates).\"\"\"\n+def import_statement(db, user_id, text, source=\"csv\", category_map=None):\n+    \"\"\"Import a statement atomically. Returns (imported, skipped_duplicates).\n+\n+    The whole batch succeeds or fails together: if any row cannot be\n+    imported, no expense from this statement is recorded.\n+    \"\"\"\n     rows = parse_statement(text)\n     imported = skipped = 0\n-    for spent_on, cents, desc in rows:\n-        if _is_duplicate(db, user_id, spent_on, cents, desc):\n-            skipped += 1\n-            continue\n-        add_expense(db, user_id, cents, category, spent_on, desc)\n-        imported += 1\n-    db.execute(\n-        \"INSERT INTO import_batches (user_id, source, row_count,\"\n-        \" imported_count, created_at) VALUES (?, ?, ?, ?, ?)\",\n-        (user_id, source, len(rows), imported, utcnow_iso()),\n-    )\n+    with db.transaction():\n+        for spent_on, cents, desc in rows:\n+            if _is_duplicate(db, user_id, spent_on, cents):\n+                skipped += 1\n+                continue\n+            add_expense(db, user_id, cents, category_for(desc, category_map),\n+                        spent_on, desc)\n+            imported += 1\n+        db.conn.execute(\n+            \"INSERT INTO import_batches (user_id, source, row_count,\"\n+            \" imported_count, created_at) VALUES (?, ?, ?, ?, ?)\",\n+            (user_id, source, len(rows), imported, utcnow_iso()),\n+        )\n     return imported, skipped\n\n--- a/tests/test_importers.py\n+++ b/tests/test_importers.py\n@@ -48,3 +48,27 @@\n                              (user,))\n         assert batch[\"row_count\"] == 3\n         assert batch[\"imported_count\"] == 3\n+\n+class TestCategoryMapping:\n+    def test_prefix_mapping(self, db, user):\n+        importers.import_statement(\n+            db, user, STATEMENT,\n+            category_map={\"COFFEE\": \"food\", \"STREAM\": \"entertainment\"})\n+        summary = monthly_summary(db, user, \"2026-03\")\n+        assert summary[\"food\"] == 1250\n+        assert summary[\"entertainment\"] == 999\n+        assert summary[\"other\"] == 4000\n+\n+    def test_mapping_to_unknown_category(self, db, user):\n+        with pytest.raises(importers.ImportError_):\n+            importers.import_statement(\n+                db, user, STATEMENT, category_map={\"COFFEE\": \"yachts\"})\n+\n+\n+class TestAtomicity:\n+    def test_atomic_batch(self, db, user):\n+        imported, skipped = importers.import_statement(db, user, STATEMENT)\n+        assert (imported, skipped) == (3, 0)\n+        batch = db.query_one(\n+            \"SELECT * FROM import_batches WHERE user_id = ?\", (user,))\n+        assert batch[\"imported_count\"] == 3\n","systems":{"baseline":{"findings":[{"file":"ledgerly/importers.py","line":82,"category":"correctness","severity":"major","title":"Prefix matching not actually case-insensitive for map keys","description":"category_for() calls desc.upper().startswith(prefix) but never uppercases `prefix` itself. The docstring and PR description promise 'case-insensitive prefix rules', but if a caller supplies a mapping with a lowercase or mixed-case key (e.g. {'coffee': 'food'}), it will never match an uppercase description like 'COFFEE SHOP' because 'COFFEE SHOP'.startswith('coffee') is False. Only mappings whose keys happen to already be uppercase work, silently breaking the advertised guarantee for any other casing.","_true":true,"_trace":null},{"file":"ledgerly/importers.py","line":93,"category":"correctness","severity":"major","title":"Duplicate detection keyed only on (date, amount) causes false positives","description":"_is_duplicate() dropped the note/description from its WHERE clause, so two genuinely distinct transactions sharing the same date and amount (e.g. two separate $12.50 purchases on the same day at different merchants) are now indistinguishable and the second legitimate expense will be silently skipped as a 'duplicate' and never imported. This is a data-loss regression relative to the previous (date, amount, description) key, and is not just a performance simplification as the PR description implies.","_true":true,"_trace":null},{"file":"ledgerly/importers.py","line":112,"category":"correctness","severity":"critical","title":"Batch may not actually be atomic if add_expense doesn't share the transaction","description":"The code was careful to switch the closing INSERT to db.conn.execute(...) instead of db.execute(...), implying db.execute() has its own commit/transaction semantics that don't compose with `with db.transaction():`. However, add_expense() (imported unchanged from .expenses) is still called as before and presumably uses db.execute() internally. If so, every expense row is committed immediately as it's added, and only the final import_batches insert is actually protected by the transaction/rollback. A later row failing (e.g. an unknown category raised by category_for) would leave previously-processed rows permanently committed, directly contradicting the PR's headline claim that 'a bad row no longer leaves a half-imported statement' and the docstring's 'no expense from this statement is recorded' guarantee.","_true":true,"_trace":null},{"file":"ledgerly/importers.py","line":84,"category":"robustness","severity":"minor","title":"Invalid category_map entries are validated lazily, not upfront","description":"category_for() only raises for a mapping's target category when a row's description actually matches that prefix. A category_map containing a bad entry (e.g. {'PARKING': 'yachts'}) for a prefix that doesn't appear in the current statement will pass silently with no error, deferring the failure to whatever future statement first contains a matching description. Validating the whole category_map once before processing rows would surface configuration mistakes immediately instead of intermittently.","_true":true,"_trace":null},{"file":"tests/test_importers.py","line":63,"category":"test-adequacy","severity":"major","title":"No test verifies rollback actually undoes prior inserts on failure","description":"test_mapping_to_unknown_category only asserts that ImportError_ is raised; it never checks the database state afterward. Given the suspected non-atomicity of add_expense() calls inside db.transaction() (see importers.py:112), this test would pass even if earlier rows in the same statement were already permanently committed before the failing row was hit \u2014 the exact regression the PR claims to fix. A real atomicity test should craft a statement where a later row fails and then assert zero expenses (and no import_batches row) exist afterward.","_true":true,"_trace":null},{"file":"tests/test_importers.py","line":68,"category":"test-adequacy","severity":"minor","title":"No test for the changed duplicate-detection key","description":"There is no test covering two rows with the same date and amount but different descriptions, which is exactly the behavior _is_duplicate() changed. Without such a test, the false-positive-skip regression described above would go undetected by the test suite.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":123.7,"cost_usd":0.1516268,"raw":null,"found":4,"missed":[],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/importers.py","line":112,"category":"correctness","severity":"critical","title":"Atomic batch promise broken: add_expense commits each row individually inside the outer transaction","description":"import_statement wraps the row loop in `with db.transaction():` to fulfil its docstring promise that \"the whole batch succeeds or fails together\". However, each row is inserted via add_expense (ledgerly/expenses.py:24), which calls `db.execute(...)` (ledgerly/db.py:126). db.execute itself opens its own `with self.transaction():` block and calls `self.conn.commit()` immediately after the INSERT succeeds (ledgerly/db.py:109-116). Because sqlite3's implicit transaction is connection-wide (not a real nested/savepoint transaction), this inner commit() commits everything pending on the connection right after e ajor\"}"},{"k":"done","turns":4,"cost":0.053443,"secs":15.8}]}],"rejected":[{"file":"tests/test_importers.py","line":62,"category":"test-adequacy","title":"test_mapping_to_unknown_category checks only that an exception is raised, not that the batch was rolled back","severity":"major","description":"This test asserts `pytest.raises(importers.ImportError_)` but never queries the database afterward to confirm no expenses or import_batches rows were committed. Additionally, because 'COFFEE' is the first (and only unmapped-safe) row in STATEMENT, the failure occurs on the very first row processed, before any add_expense call succeeds \u2014 so even if the test did check DB state, it would not exercise the actual atomicity guarantee (rolling back rows that were already inserted earlier in the same batch, e.g. GROCER LTD or STREAMFLIX succeeding before a later row like a mis-mapped one fails). This leaves the core 'a bad row no longer leaves a half-imported statement' claim from the PR description completely unverified by any test in this file, and combined with the nested per-row commit bug in db.execute (ledgerly/db.py:126-129), a genuine partial-import regression would go undetected.","reviewer":"tests","verification":{"verdict":"REJECTED","confidence":"high","evidence":"Reproduced the underlying production behavior directly: import_statement wraps rows in db.transaction(), but add_expense delegates to db.execute(), which itself opens a nested `with self.transaction():` block that commits (sqlite3.Connection.commit()) after every single row. I confirmed this by rearranging the STATEMENT so a successful row precedes the mapping failure (GROCER LTD before COFFEE->'yachts'): the GROCER LTD expense was committed to the DB despite the overall ImportError_, proving the atomicity claim is broken in general. However, I then ran the exact scenario used in test_mapping_to_unknown_category (COFFEE is literally the first row in STATEMENT) and confirmed zero expense rows and zero batch rows exist after the exception -- so the test's current assertion (pytest.raises only) is not factually 'covering up' any incorrect behavior in this specific run; it simply doesn't happen to exercise the interesting case. The finding is accurate on the facts (test doesn't check DB state; COFFEE-first ordering means even a DB check here wouldn't catch the partial-commit bug), but it is filed as a test-adequacy complaint arguing 'this leaves the atomicity claim completely unverified by any test in this file' -- that is a missing-coverage observation ('no test verifies rollback-on-mid-batch-failure'), not a claim that an existing test is tautological, weakened, or promises a check (by name/structure) it doesn't perform. test_mapping_to_unknown_category's name/purpose is about category-mapping validation, not atomicity, so it isn't misrepresenting itself. Per the gate, coverage-gap findings about tests are advisory even when the underlying bug they'd have needed to catch is real.","rejection_reason":"policy","adjusted_severity":"minor"}}],"stages":[{"stage":"reviewer_correctness","findings":3,"seconds":113.4,"cost_usd":0.19315600000000005},{"stage":"reviewer_security","findings":0,"seconds":58.9,"cost_usd":0.143844},{"stage":"reviewer_tests","findings":2,"seconds":92.7,"cost_usd":0.19633319999999999},{"stage":"verifier","in":5,"confirmed":4,"seconds":81.3}],"seconds":194.7,"cost_usd":1.0857,"raw":5,"found":4,"missed":[],"false_positives":0}}},"case19_household_invites":{"meta":{"title":"Household invite codes","tier":3,"clean":false,"pr_description":"Owners can now invite people without knowing their user id: create_invite() issues a short shareable code, accept_invite() joins the caller to the household. Includes schema and tests.","defects":[{"id":"c19-d1","file":"ledgerly/household.py","line":91,"severity":"major","category":"security","description":"Invite codes are 6 hex chars (~16.7M values) from the predictable random module. auth.py consistently uses secrets SERT INTO invites (code, household_id, created_by, created_at)\"\n+        \" VALUES (?, ?, ?, ?)\",\n+        (code, household_id, acting_user, utcnow_iso()),\n+    )\n+    return code\n+\n+\n+def accept_invite(db, code, user_id):\n+    \"\"\"Join the household an invite code belongs to. Returns household id.\"\"\"\n+    row = db.query_one(\n+        \"SELECT household_id FROM invites WHERE code = ?\", (code,)\n+    )\n+    if row is None:\n+        raise HouseholdError(\"invalid invite code\")\n+    hid = row[\"household_id\"]\n+    if _member_role(db, hid, user_id) is not None:\n+        raise HouseholdError(\"already a member\")\n+    db.execute(\n+        \"INSERT INTO household_members (household_id, user_id, role, joined_at)\"\n+        \" VALUES (?, ?, 'member', ?)\",\n+        (hid, user_id, utcnow_iso()),\n+    )\n+    return hid\n \n \n def add_shared_expense(db, household_id, paid_by, amount_cents, category,\n\n--- a/tests/test_household.py\n+++ b/tests/test_household.py\n@@ -69,3 +69,25 @@\n             net[debtor] += cents\n             net[creditor] -= cents\n         assert all(v == 0 for v in net.values())\n+\n+class TestInvites:\n+    def test_invite_flow(self, db, user, carol):\n+        hid = household.create_household(db, user, \"Flat\")\n+        code = household.create_invite(db, hid, user)\n+        assert household.accept_invite(db, code, carol) == hid\n+        assert household.require_member(db, hid, carol) == \"member\"\n+\n+    def test_only_owner_invites(self, db, home, bob):\n+        with pytest.raises(household.HouseholdError):\n+            household.create_invite(db, home, bob)\n+\n+    def test_bad_code(self, db, carol):\n+        with pytest.raises(household.HouseholdError):\n+            household.accept_invite(db, \"zzzzzz\", carol)\n+\n+    def test_member_cannot_accept_twice(self, db, user, carol):\n+        hid = household.create_household(db, user, \"Flat\")\n+        code = household.create_invite(db, hid, user)\n+        household.accept_invite(db, code, carol)\n+        with pytest.raises(household.HouseholdError):\n+            household.accept_invite(db, code, carol)\n","systems":{"baseline":{"findings":[{"file":"ledgerly/household.py","line":89,"category":"security","severity":"major","title":"Invite codes use non-cryptographic RNG and small keyspace","description":"create_invite() generates the code with random.randrange, which is a Mersenne Twister PRNG that is not cryptographically secure and can be predicted if its internal state is inferred. Combined with only 6 hex characters (16^6 \u2248 16.7M possibilities) and no rate limiting on accept_invite(), an attacker can brute-force valid codes and join a household to gain access to shared financial data. Should use the `secrets` module (e.g. secrets.token_hex) and consider a longer code.","_true":true,"_trace":null},{"file":"ledgerly/household.py","line":106,"category":"correctness","severity":"major","title":"Invite codes are never consumed, allowing unlimited reuse by different users","description":"The invites table has a used_at column, implying single-use semantics, but accept_invite() never checks or sets it. Once a code is created it remains valid forever and can be used by any number of distinct users to join the household (the only check is 'already a member' for the same user), not just the one intended invitee. This defeats the purpose of a controlled invite and lets a leaked/guessed code be reused indefinitely.","_true":true,"_trace":null},{"file":"ledgerly/household.py","line":90,"category":"robustness","severity":"major","title":"No handling of invite code collisions","description":"code is generated with 16^6 possibilities and inserted directly with no uniqueness check or retry loop. Since `code` is the PRIMARY KEY, a collision with an existing (especially still-unused/unexpired) invite will raise an unhandled sqlite IntegrityError instead of being retried or surfaced as a HouseholdError, causing create_invite()   [100%]\n13 passed in 11.46s"},{"k":"say","text":"All existing tests pass, confirming this isn't caught elsewhere and is a real gap in the new code path.\n\n{\"verdict\": \"CONFIRMED\", \"confidence\": \"high\", \"evidence\": \"Read household.py: add_member() (lines 51-67) checks `count >= MAX_MEMBERS` before inserting into household_members, but accept_invite() (lines 100-115) performs only an invite-code-exists check and an already-a-member check, with no count/cap check before its INSERT. Reproduced with execution: filled a household to 12 members via add_member (correctly blocked with 'household is full' on the 12th add), then created an invite code and looped accept_invite() 20 more times \u2014 all succeeded, growing the household to 32 members with the cap completely bypassed. Existing test suite (13 tests) still passes, confirming this gap is unguarded elsewhere.\", \"adjusted_severity\": \"major\"}"},{"k":"done","turns":6,"cost":0.0738742,"secs":51.8}]},{"file":"ledgerly/household.py","line":91,"category":"security","severity":"major","title":"Invite codes generated with non-cryptographic PRNG","description":"create_invite() uses `random.randrange(16 ** 6)` to generate the invite code that grants household membership. Python's `random` module is a Mersenne Twister PRNG, not a CSPRNG: it is not suitable for generating security tokens. If an attacker can observe a sequence of generated codes (e.g. via other invites in the same process), they can potentially reconstruct the PRNG state and predict future invite codes, letting them join households they were never invited to. This should use `secrets.token_hex()` / `secrets.randbelow()` instead of `random`.","reviewer":"security","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/household.py:87-97; confirmed create_invite() uses `code = \"%06x\" % random.randrange(16 ** 6)` with `import random` (Mersenne Twister, not a CSPRNG) to generate the household invite code, which is the sole credential checked in accept_invite() to grant membership (household.py:100-115) \u2014 no signature, expiry, or other binding. Grepped the codebase and found no use of `secrets` in household.py, while ledgerly/auth.py in the same PR-adjacent codebase already uses `secrets.token_hex`/`secrets.token_urlsafe` for salts and session tokens, showing the project has an established secure-token convention that create_invite() fails to follow. This is a real, well-documented weakness (Mersenne Twister state can be reconstructed from sufficient outputs, enabling prediction of future codes) directly affecting a security-sensitive code path, not an advisory/test-coverage nitpick.","adjusted_severity":"major"},"_true":true,"_trace":[{"k":"tool","name":"Read","arg":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpw5hj5249/repo/ledgerly/household.py"},{"k":"out","text":"1\t\"\"\"Shared households: several users pooling expenses.\n2\t\n3\tA household has one owner and any number of members. Shared expenses are\n4\tpaid by one member and split equally; settlement computes who owes whom.\n5\tAll amounts are integer cents.\n6\t\"\"\"\n7\t\n8\timport random\n9\t\n10\tfrom .expenses import VALID_CATEGORIES, ExpenseError\n11\tfrom .utils import parse_iso_date, utcnow_iso\n12\t\n13\tMAX_MEMBERS = 12\n14\t\n15\t\n16\tclass HouseholdError(Exception):\n17\t    pass\n18\t\n19\t\n20\tdef create_household(db, owner_id, name):\n21\t    if not name.strip():\n22\t        raise HouseholdError(\"household name must not be empty\")\n23\t    hid = db.execute(\n24\t        \"INSERT INTO households (name, owner_id, created_at) VALUES \n\u2026 (+6660 chars)"},{"k":"say","text":"The claim is factually accurate: line 91 confirms `random.randrange(16 ** 6)` seeded from Python's Mersenne Twister (`import random` at line 8), used to generate a security-sensitive invite token that grants household membership. There's no use of `secrets` anywhere, no expiry, no rate limiting, no single-use invalidation beyond marking used (actually `used_at` column exists in schema but is never set/checked in `accept_invite`, making codes reusable indefinitely by different users \u2014 though that's a separate issue). This is a genuine, well-known anti-pattern: `random` is not a CSPRNG and predictable/reconstructable state is a documented real-world attack vector (Mersenne Twister state recovery from outputs is well established), which directly threatens the security property the invite code is meant to provide (unguessable secret granting access)."},{"k":"tool","name":"Bash","arg":"grep -rn \"secrets\" /private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpw5hj5249/repo/ledgerly/ 2>/dev/null; echo \"---\"; python3 -c \"\nimport random\nrandom.seed(1234)\nprint([('%06x' % random.randrange(16**6)) for _ in range(3)])\n\"\n"},{"k":"out","text":"/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpw5hj5249/repo/ledgerly/auth.py:9:import secrets\n/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpw5hj5249/repo/ledgerly/auth.py:36:    salt = secrets.token_hex(16)\n/private/var/folders/16/68bllkdn5n75d9gn5qj1thtw0000gp/T/tmpw5hj5249/repo/ledgerly/auth.py:56:    token = secrets.token_urlsafe(32)\n---\n['e1a7b4', '3bd3d4', '03d5ec']"},{"k":"say","text":"Notably, `ledgerly/auth.py` already correctly uses `secrets.token_hex`/`secrets.token_urlsafe` for password salts and session tokens elsewhere in this same codebase \u2014 confirming the project has an established convention for security tokens that `create_invite()` deviates from, reinforcing this is a genuine oversight rather than a stylistic nitpick.\n\n{\"verdict\": \"CONFIRMED\", \"confidence\": \"high\", \"evidence\": \"Read ledgerly/household.py:87-97; confirmed create_invite() uses `code = \\\"%06x\\\" % random.randrange(16 ** 6)` with `import random` (Mersenne Twister, not a CSPRNG) to generate the household invite code, which is the sole credential checked in accept_invite() to grant membership (household.py:100-115) \u2014 no signature, expiry, or other binding. Grepped the codebase and found no use of `secrets` in household.py, while ledgerly/auth.py in the same PR-adjacent codebase already uses `secre\n\u2026 (+438 chars)"},{"k":"done","turns":3,"cost":0.057194800000000004,"secs":20.3}]},{"file":"tests/test_household.py","line":88,"category":"test-adequacy","title":"test_member_cannot_accept_twice does not test single-use invite codes","severity":"major","description":"The test reuses the same accepting user (carol) both times, so the second accept_invite call fails only because of the pre-existing 'already a member' check in accept_invite (household.py:108-109), not because the invite code itself was consumed. The invites table has a `used_at` column (db.py) implying invites are meant to be single-use, but accept_invite never sets used_at, so the same code can be redeemed by any number of distinct users indefinitely. A test that had a second, different user (e.g. a freshly registered user) attempt to accept the same already-used code would successfully join and expose this bug, but no such test exists. The current test's name promises 'cannot accept twice' but only verifies duplicate-membership rejection for a single user, giving false confidence that invite codes are properly single-use.","reviewer":"tests","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/household.py: accept_invite() never updates the invites.used_at column and never checks whether an invite was already used \u2014 it only checks whether the accepting user is already a household member. Grepped the codebase for 'used_at' and found it referenced only in the db.py schema, never read or written anywhere in household.py. Reproduced with a live script: created a household+invite as alice, had carol accept it (succeeds), then had a distinct third user 'dave' accept the exact same code \u2014 this also succeeded and dave was inserted as a household member, proving the code is reusable indefinitely by different users rather than single-use. Ran the full existing test suite (pytest tests/test_household.py) and all 13 tests pass, confirming this gap is real and unexercised by current tests. This is a genuine logic/security defect in accept_invite (not just a missing test), so it passes the policy gate as well.","adjusted_severity":"major"},"_true":false,"_trace":[{"k":"tool","name":"Bash","arg":"grep -n \"used_at\" -r ledgerly/ && sed -n '1,60p' tests/conftest.py 2>/dev/null | head -80"},{"k":"out","text":"ledgerly/db.py:96:    used_at TEXT\nimport pytest\n\nfrom ledgerly.db import Database\nfrom ledgerly import auth\n\n\n@pytest.fixture()\ndef db():\n    d = Database()\n    yield d\n    d.close()\n\n\n@pytest.fixture()\ndef user(db):\n    return auth.register(db, \"alice\", \"s3cretpass\")\n\n\n@pytest.fixture()\ndef bob(db):\n    return auth.register(db, \"bob\", \"bobspassword\")\n\n\n@pytest.fixture()\ndef carol(db):\n    return auth.register(db, \"carol\", \"carolspassword\")"},{"k":"say","text":"`used_at` is written nowhere except the schema definition \u2014 confirmed. Let me actually reproduce the bug with a distinct second user accepting the same code."},{"k":"tool","name":"Bash","arg":"python3 -c \"\nfrom ledgerly.db import Database\nfrom ledgerly import auth, household\n\ndb = Database()\nalice = auth.register(db, 'alice', 'password1')\ncarol = auth.register(db, 'carol', 'password2')\ndave = auth.register(db, 'dave', 'password3')\n\nhid = household.create_household(db, alice, 'Flat')\ncode \n\u2026 (+246 chars)"},{"k":"out","text":"carol joins: 1\ndave joins with SAME code: 1\ndave role: member"},{"k":"say","text":"Confirmed: a second, distinct user (dave) successfully joins using the same invite code that carol already used \u2014 invite codes are not single-use, exactly as the finding describes. This is a real code defect (accept_invite never marks/checks `used_at`), not merely a missing-test complaint; the finding centers on the actual security/logic bug, with the test-naming point as supporting evidence."},{"k":"tool","name":"Bash","arg":"sed -n '85,120p' ledgerly/household.py"},{"k":"out","text":"def create_invite(db, household_id, acting_user):\n    \"\"\"Issue a shareable invite code. Owner only.\"\"\"\n    if _member_role(db, household_id, acting_user) != \"owner\":\n        raise HouseholdError(\"only the owner can create invites\")\n    code = \"%06x\" % random.randrange(16 ** 6)\n    db.execute(\n        \"INSERT INTO invites (code, household_id, created_by, created_at)\"\n        \" VALUES (?, ?, ?, ?)\",\n        (code, household_id, acting_user, utcnow_iso()),\n    )\n    return code\n\n\ndef accept_invite(db, code, user_id):\n    \"\"\"Join the household an invite code belongs to. Returns household id.\"\"\"\n    row = db.query_one(\n        \"SELECT household_id FROM invites WHERE code = ?\", (code,)\n    )\n    i\n\u2026 (+556 chars)"},{"k":"tool","name":"Bash","arg":"python3 -m pytest tests/test_household.py -q 2>&1 | tail -20"},{"k":"out","text":".............                                                            [100%]\n13 passed in 11.70s"},{"k":"say","text":"All existing tests pass, confirming the bug is real but silently unexercised by the suite \u2014 matching the finding exactly."},{"k":"tool","name":"Bash","arg":"true"},{"k":"out","text":"(Bash completed with no output)"},{"k":"say","text":"{\"verdict\": \"CONFIRMED\", \"confidence\": \"high\", \"evidence\": \"Read ledgerly/household.py: accept_invite() never updates the invites.used_at column and never checks whether an invite was already used \u2014 it only checks whether the accepting user is already a household member. Grepped the codebase for 'used_at' and found it referenced only in the db.py schema, never read or written anywhere in household.py. Reproduced with a live script: created a household+invite as alice, had carol accept it (succeeds), then had a distinct third user 'dave' accept the exact same code \u2014 this also succeeded and dave was inserted as a household member, proving the code is reusable indefinitely by different users rather than single-use. Ran the full existing test suite (pytest tests/test_household.py) and all 13 tests pass, confirming this gap is real and unexercised by current tests. This is a genuine logic/sec\n\u2026 (+126 chars)"},{"k":"done","turns":6,"cost":0.057888600000000005,"secs":39.9}]}],"rejected":[],"stages":[{"stage":"reviewer_correctness","findings":3,"seconds":83.3,"cost_usd":0.1193464},{"stage":"reviewer_security","findings":3,"seconds":36.8,"cost_usd":0.0688294},{"stage":"reviewer_tests","findings":1,"seconds":36.2,"cost_usd":0.0684206},{"stage":"verifier","in":3,"confirmed":3,"seconds":57.8}],"seconds":141.1,"cost_usd":0.4456,"raw":7,"found":2,"missed":["c19-d3"],"false_positives":1}}},"case20_recurring_v2":{"meta":{"title":"Recurring rules: biweekly cadence and pause/resume","tier":3,"clean":false,"pr_description":"Adds the two most requested recurring-rule features: a biweekly cadence (every second week on a weekday) and pause/resume so users can suspend a subscription rule while keeping its history. Tests included for both.","defects":[{"id":"c20-d1","file":"ledgerly/recurring.py","line":109,"severity":"critical","category":"correctness","description":"The biweekly branch matches every date whose weekday equals the rule's weekday \u2014 identical to weekly. Nothing tracks which alternate week the rule is anchored to, so a $200 'biweekly' rule charges $200 weekly, double-billing the user. Run occurrences_between over a 4-week window: it returns 4 dates, not 2."},{"id":"c20-d2","file":"ledgerly/recurring.py","line":67,"severity":"critical","category":"correctness","description":"resume_rule reactivates the rule but leaves last_materialized at its pre-pause value, and the docstring promises charging resumes 'from now'. The next materialize_due back-fills an expense for every occurrence during the paused period \u2014 a rule paused for six months gets six months of charges on resume. resume must also advance last_materialized to today."},{"id":"c20-d3","file":"tests/test_recurring.py","line":72,"severity":"major","category":"test-adequacy","description":"The biweekly test spans only 8 days, a window in which weekly and biweekly cadences produce the identical single occurrence \u2014 it cannot distinguish the two. A 4-week window would fail against this implementation."},{"id":"c20-d4","file":"tests/test_recurring.py","line":87,"severity":"major","category":"test-adequacy","description":"test_resume_reactivates pauses and resumes on the same day, never spanning a paused occurrence, so resume's back-charging bug is structurally invisible to it despite the test being named for exactly this behavior. Promoted in adjudication round 2: flagged independently by two systems."}]},"diff":"--- a/ledgerly/recurring.py\n+++ b/ledgerly/recurring.py\n@@ -12,7 +12,7 @@\n from .expenses import VALID_CATEGORIES, ExpenseError, add_expense\n from .utils import parse_iso_date\n \n-VALID_CADENCES = {\"monthly\", \"weekly\"}\n+VALID_CADENCES = {\"monthly\", \"weekly\", \"biweekly\"}\n \n \n class RecurringError(Exception):\n@@ -30,9 +30,9 @@\n     if cadence == \"monthly\":\n         if not (day_of_month and 1 <= day_of_month <= 31):\n             raise RecurringError(\"monthly rules need day_of_month in 1..31\")\n-    if cadence == \"weekly\":\n+    if cadence in (\"weekly\", \"biweekly\"):\n         if weekday is None or not 0 <= weekday <= 6:\n-            raise RecurringError(\"weekly rules need weekday in 0..6\")\n+            raise RecurringError(f\"{cadence} rules need weekday in 0..6\")\n     return db.execute(\n         \"INSERT INTO recurring_rules (user_id, amount_cents, category, note,\"\n         \" cadence, day_of_month, weekday) VALUES (?, ?, ?, ?, ?, ?, ?)\",\n@@ -50,6 +50,32 @@\n     db.execute(\n         \"UPDATE recurring_rules SET active = 0 WHERE id = ?\", (rule_id,)\n     )\n+\n+\n+def pause_rule(db, user_id, rule_id):\n+    \"\"\"Suspend a rule without losing its configuration or history.\"\"\"\n+    _own_rule(db, user_id, rule_id)\n+    db.execute(\n+        \"UPDATE recurring_rules SET active = 0 WHERE id = ?\", (rule_id,)\n+    )\n+\n+\n+def resume_rule(db, user_id, rule_id):\n+    \"\"\"Reactivate a paused rule; charging resumes from now.\"\"\"\n+    _own_rule(db, user_id, rule_id)\n+    db.execute(\n+        \"UPDATE recurring_rules SET active = 1 WHERE id = ?\", (rule_id,)\n+    )\n+\n+\n+def _own_rule(db, user_id, rule_id):\n+    row = db.query_one(\n+        \"SELECT id FROM recurring_rules WHERE id = ? AND user_id = ?\",\n+        (rule_id, user_id),\n+    )\n+    if row is None:\n+        raise RecurringError(\"rule not found\")\n+    return row\n \n \n def _clamp_day(year, month, day):\n@@ -71,10 +97,16 @@\n             m += 1\n             if m == 13:\n                 m, y = 1, y + 1\n-    else:  # weekly\n+    elif rule[\"cadence\"] == \"weekly\":\n         d = start + timedelta(days=1)\n         while d <= end:\n             if d.weekday() == rule[\"weekday\"]:\n+                out.append(d)\n+            d += timedelta(days=1)\n+    else:  # biweekly: every second week on the given weekday\n+        d = start + timedelta(days=1)\n+        while d <= end:\n+            if d.weekday() == rule[\"weekday\"]:  # biweekly\n                 out.append(d)\n             d += timedelta(days=1)\n     return out\n\n--- a/tests/test_recurring.py\n+++ b/tests/test_recurring.py\n@@ -64,3 +64,30 @@\n             db, user, 5000, \"food\", \"monthly\", day_of_month=5)\n         recurring.deactivate_rule(db, user, rid)\n         assert recurring.materialize_due(db, user, today=date(2026, 3, 6)) == 0\n+\n+class TestBiweekly:\n+    def test_biweekly_occurrence(self):\n+        rule = {\"cadence\": \"biweekly\", \"weekday\": 0}  # Mondays\n+        occs = recurring.occurrences_between(\n+            rule, date(2026, 3, 2), date(2026, 3, 10))\n+        assert occs == [date(2026, 3, 9)]\n+\n+    def test_biweekly_validation(self, db, user):\n+        with pytest.raises(recurring.RecurringError):\n+            recurring.create_rule(db, user, 500, \"food\", \"biweekly\")\n+\n+\n+class TestPauseResume:\n+    def test_pause_stops_materialization(self, db, user):\n+        rid = recurring.create_rule(\n+            db, user, 5000, \"food\", \"monthly\", day_of_month=5)\n+        recurring.pause_rule(db, user, rid)\n+        assert recurring.materialize_due(db, user, today=date(2026, 3, 6)) == 0\n+\n+    def test_resume_reactivates(self, db, user):\n+        rid = recurring.create_rule(\n+            db, user, 5000, \"food\", \"monthly\", day_of_month=5)\n+        recurring.pause_rule(db, user, rid)\n+        recurring.resume_rule(db, user, rid)\n+        n = recurring.materialize_due(db, user, today=date(2026, 3, 6))\n+        assert n == 1\n","systems":{"baseline":{"findings":[{"file":"ledgerly/recurring.py","line":109,"category":"correctness","severity":"critical","title":"Biweekly cadence generates an occurrence every week, not every second week","description":"The `else` branch handling `cadence == \"biweekly\"` in `occurrences_between` is byte-for-byte identical to the `weekly` branch above it: it walks every day in the range and appends every date matching `rule[\"weekday\"]`. There is no parity/skip logic (e.g. comparing elapsed weeks against a reference date) to only emit every second matching weekday. As a result, a 'biweekly' rule will materialize an expense every week, silently doubling the number of charges a user expects for a biweekly subscription. This is a money-affecting bug, not just a naming issue.","_true":true,"_trace":null},{"file":"ledgerly/recurring.py","line":33,"category":"correctness","severity":"major","title":"No anchor/reference date exists to compute biweekly parity","description":"`create_rule` accepts `weekday` for both `weekly` and `biweekly` cadences and inserts and never as an unconditional default smuggled into a perf PR."},{"id":"c21-d3","file":"ledgerly/db.py","line":100,"severity":"major","category":"robustness","description":"The new index lacks IF NOT EXISTS while every table in the same executescript uses IF NOT EXISTS. SCHEMA runs on every Database() construction, so opening an existing database file a second time raises OperationalError: index already exists. In-memory test databases never reopen, which is why CI stays green."}]},"diff":"--- a/ledgerly/db.py\n+++ b/ledgerly/db.py\n@@ -96,6 +96,9 @@\n     imported_count INTEGER NOT NULL,\n     created_at TEXT NOT NULL\n );\n+\n+CREATE INDEX idx_expenses_user_category\n+    ON expenses (user_id, category, spent_on);\n \"\"\"\n \n \n@@ -104,6 +107,7 @@\n         self.conn = sqlite3.connect(path)\n         self.conn.row_factory = sqlite3.Row\n         self.conn.execute(\"PRAGMA foreign_keys = ON\")\n+        self.conn.execute(\"PRAGMA synchronous = OFF\")\n         self.conn.executescript(SCHEMA)\n \n     @contextmanager\n\n--- a/ledgerly/reports.py\n+++ b/ledgerly/reports.py\n@@ -37,21 +37,24 @@\n     Returns a list of dicts with category, limit, spent, remaining and\n     an over-budget flag. Categories without a budget are omitted.\n     \"\"\"\n-    spend = monthly_summary(db, user_id, month)\n-    budgets = db.query(\n-        \"SELECT category, limit_cents FROM budgets\"\n-        \" WHERE user_id = ? AND month = ?\",\n+    rows = db.query(\n+        \"SELECT b.category, b.limit_cents,\"\n+        \" COALESCE(SUM(e.amount_cents), 0) AS spent\"\n+        \" FROM budgets b\"\n+        \" LEFT JOIN expenses e ON e.user_id = b.user_id\"\n+        \"   AND e.category = b.category\"\n+        \" WHERE b.user_id = ? AND b.month = ?\"\n+        \" GROUP BY b.category, b.limit_cents\",\n         (user_id, month),\n     )\n     out = []\n-    for b in budgets:\n-        spent = spend.get(b[\"category\"], 0)\n-        remaining = b[\"limit_cents\"] - spent\n+    for b in rows:\n+        remaining = b[\"limit_cents\"] - b[\"spent\"]\n         out.append({\n             \"category\": b[\"category\"],\n             \"limit\": format_money(b[\"limit_cents\"]),\n-            \"spent\": format_money(spent),\n+            \"spent\": format_money(b[\"spent\"]),\n             \"remaining\": format_money(remaining),\n-            \"over_budget\": spent > b[\"limit_cents\"],\n+            \"over_budget\": b[\"spent\"] > b[\"limit_cents\"],\n         })\n     return out\n","systems":{"baseline":{"findings":[{"file":"ledgerly/reports.py","line":44,"category":"correctness","severity":"critical","title":"budget_status no longer filters expenses by month","description":"The original code computed spend via monthly_summary(db, user_id, month), which restricted expenses to the requested month. The new LEFT JOIN only matches on e.user_id = b.user_id AND e.category = b.category \u2014 there is no condition tying e.spent_on (or any date field) to the requested month. As a result, 'spent' now sums ALL expenses ever recorded in that category for the user, across every month, not just the target month. This inflates spend and 'over_budget' flags for any category with expense history from other months, directly contradicting the PR's 'No behavior change intended' claim.","_true":true,"_trace":null},{"file":"ledgerly/db.py","line":110,"category":"robustness","severity":"critical","title":"synchronous=OFF risks database corruption, not just lost writes","description":"Setting PRAGMA synchronous = OFF disables fsync calls SQLite normally issues before critical transaction boundaries. Per SQLite documentation, with synchronous=OFF an OS crash or power loss (not just an application crash) can leave the database file corrupted, not merely missing the most recent transactions as would happen with the safer 'NORMAL' setting under WAL mode. For a financial ledger storing expenses/budgets, this is an unacceptable durability/integrity regression introduced purely for a performance PR that claims no behavior change.","_true":true,"_trace":null},{"file":"ledgerly/reports.py","line":40,"category":"test-adequacy","severity":"major","title":"No test covers month-boundary filtering for budget_status","description":"The diff changes the core aggregation query for budget_status but includes no test verifying that expenses outside the requested month are excluded from 'spent'. Such a test would have caught the missing month filter in the LEFT JOIN (see the correctness finding), which silently changes production behavior.","_true":true,"_trace":null}],"rejected":[],"stages":[],"seconds":51.0,"cost_usd":0.0657468,"raw":null,"found":2,"missed":["c21-d3"],"false_positives":0},"agent-v5":{"findings":[{"file":"ledgerly/reports.py","line":44,"category":"correctness","severity":"critical","title":"budget_status sums all-time expenses instead of the requested month","description":"The new LEFT JOIN in budget_status joins expenses to budgets on user_id and category only (lines 44-45), with no filter on expenses.spent_on. The old implementation computed spend via monthly_summary(), which filtered with `substr(spent_on, 1, 7) = ?` (reports.py:27) to restrict totals to the requested month. Now, for a budget on category 'food' for month '2026-03', the query sums every expense ever recorded in that category for that user, across all months, not just March. For example, a user with $50 spent in food in January and a $30 budget set for March with no March expenses would now show spent=$50 and over_budget=True for March, even though March spend is $0. This directly contradicts the function's docstring ('Compare spend against each budget set for the month') and the PR's explicit claim of 'No behavior change intended'. The bug is not caught by tests because every existing budget_status test only adds expenses within the same month being queried (tests/test_ledgerly.py:96-107).","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high rectness","severity":"critical","title":"Weekly digest is marked read before the user ever sees it","description":"send_weekly_digests() inserts the new digest notification via notify(db, uid, \"digest\", body) at line 92, then immediately runs `UPDATE notifications SET read_at = ? WHERE user_id = ?` (lines 93-96) with no upper bound on created_at or exclusion of the just-inserted row. Since the UPDATE filters only by user_id, it also marks the digest notification that was just created as read. As a result, notify.unread(db, uid) and the new GET /notifications endpoint will never show the weekly digest as unread \u2014 the very notification the job exists to deliver disappears immediately. This contradicts the function's own docstring ('Queue a spending digest for every user') and the PR description ('mails every user a spending digest'); the digest is queued but instantly consumed. The accompanying test (tests/test_notify.py test_digest_queued_per_user) masks this: `assert any(...) or True` is a tautology, and `bodies.count(\"digest\") <= 1` passes trivially because the count is always 0.","reviewer":"correctness","verification":{"verdict":"CONFIRMED","confidence":"high","evidence":"Read ledgerly/notify.py: send_weekly_digests() inserts a digest via notify() then runs `UPDATE notifications SET read_at = ? WHERE user_id = ?` unconditionally (no created_at bound, no exclusion of the new row id). Reproduced directly: after calling send_weekly_digests(db, '2026-03') for two users, notify.unread(db, uid) returns [] for both, and querying all rows shows read_at is set on the just-inserted digest rows immediately. Also ran tests/test_notify.py \u2014 all 8 tests pass, confirming test_digest_queued_per_user is tautological (`assert ... or True` and `bodies.count('digest') <= 1` trivially true since unread is always empty), masking the bug. This breaks the newly added GET /notifications endpoint's ability to ever surface the digest, contradicting the function's stated purpose.","adjusted_severity":"critical"},"_true":true,"_trace":[{"k":"tool","name":"Bash","arg":"cat ledgerly/notify.py"},{"k":"out","text":"\"\"\"User notifications: over-budget alerts and weekly digests.\n\nNotifications are rows in the notifications table; delivery (email, push)\nis out of scope \u2014 a delivery worker reads unread rows. run_budget_alerts\nis designed to be called after any expense write; it only notifies once\nper (category, month) so users are not spammed.\n\"\"\"\n\nfrom .reports import budget_status, monthly_summary\nfrom .utils import format_money, utcnow_iso\n\n\ndef notify(db, user_id, kind, body):\n    return db.execute(\n        \"INSERT INTO notifications (user_id, kind, body, created_at)\"\n        \" VALUES (?, ?, ?, ?)\",\n        (user_id, kind, body, utcnow_iso()),\n    )\n\n\ndef unread(db, user_id):\n    return [dict(r) for r i\n\u2026 (+2525 chars)"},{"k":"say","text":"This matches the diff exactly. Let me run an actual reproduction to confirm behavior."},{"k":"tool","name":"Bash","arg":"cat tests/test_notify.py; echo ---; ls ledgerly; echo ---; find . -name conftest.py | xargs cat 2>/dev/null | head -100"},{"k":"out","text":"from ledgerly import expenses, notify, reports\n\n\nclass TestNotifications:\n    def test_notify_and_unread(self, db, user):\n        notify.notify(db, user, \"info\", \"hello\")\n        assert [n[\"body\"] for n in notify.unread(db, user)] == [\"hello\"]\n\n    def test_mark_read(self, db, user):\n        nid = notify.notify(db, user, \"info\", \"hello\")\n        notify.mark_read(db, user, nid)\n        assert notify.unread(db, user) == []\n\n    def test_mark_read_scoped_to_user(self, db, user, bob):\n        nid = notify.notify(db, user, \"info\", \"hello\")\n        notify.mark_read(db, bob, nid)\n        assert len(notify.unread(db, user)) == 1\n\n\nclass TestBudgetAlerts:\n    def test_alert_fires_once(self, db, user)\n\u2026 (+1915 chars)"},{"k":"say","text":"Now let me write a direct reproduction sc
